<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Ledger — Finance Manager</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#1C2333">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F6F3EC; --paper-alt:#EFEAdc; --card:#FBF9F4;
    --ink:#1C2333; --ink-soft:#5A5F70; --ink-faint:#8B8D99;
    --gold:#B8862E; --gold-soft:#E9D9AE;
    --green:#2F6844; --green-soft:#E3EEE6;
    --red:#A13D2B; --red-soft:#F4E4DF;
    --line:#DCD5C2; --line-strong:#C7BEA3;
    --radius:2px; --shadow:0 1px 2px rgba(28,35,51,0.06), 0 4px 14px rgba(28,35,51,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;min-height:100vh;}
  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{width:216px;flex-shrink:0;background:var(--ink);color:#EDE9DC;display:flex;flex-direction:column;padding:28px 0 16px;}
  .brand{padding:0 22px 22px;border-bottom:1px solid rgba(237,233,220,0.14);margin-bottom:10px;}
  .brand .mark{font-family:'Fraunces',serif;font-weight:700;font-size:22px;letter-spacing:0.3px;color:var(--gold-soft);}
  .brand .tag{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#9AA0AD;margin-top:4px;}
  .nav{display:flex;flex-direction:column;padding:8px 10px;gap:2px;flex:1;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);color:#C6C2B4;cursor:pointer;font-size:13px;font-weight:500;letter-spacing:0.2px;border-left:2px solid transparent;user-select:none;}
  .nav-item .num{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#6E7180;width:16px;}
  .nav-item:hover{background:rgba(255,255,255,0.04);color:#EDE9DC;}
  .nav-item.active{background:rgba(184,134,46,0.14);color:#F3E7C8;border-left:2px solid var(--gold);}
  .nav-item.active .num{color:var(--gold-soft);}
  .who{margin:14px 14px 0;padding:10px 11px;background:rgba(255,255,255,0.04);border:1px solid rgba(237,233,220,0.1);border-radius:var(--radius);font-size:11px;color:#9AA0AD;}
  .who b{color:#EDE9DC;display:block;font-size:12.5px;margin-bottom:2px;}
  .role-badge{display:inline-block;margin-top:6px;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:0.4px;background:rgba(184,134,46,0.2);color:var(--gold-soft);}
  .sync-pill{margin:8px 14px 0;padding:9px 11px;background:rgba(255,255,255,0.04);border:1px solid rgba(237,233,220,0.1);border-radius:var(--radius);font-size:11px;color:#9AA0AD;}
  .sync-pill .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#6E7180;margin-right:6px;}
  .sync-pill.connected .dot{background:#5FAE7C;}
  .signout{margin:10px 14px 0;font-size:11px;color:#9AA0AD;cursor:pointer;text-decoration:underline;}

  /* Main */
  .main{flex:1;min-width:0;padding:30px 40px 60px;max-width:1180px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-head h1{font-family:'Fraunces',serif;font-weight:600;font-size:26px;margin:0;letter-spacing:0.2px;}
  .page-head .sub{color:var(--ink-soft);font-size:13px;margin-top:3px;}
  .btn{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:0.2px;padding:9px 16px;border-radius:var(--radius);border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;}
  .btn:hover{background:#2b3348;}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line-strong);}
  .btn.secondary:hover{background:var(--paper-alt);}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);}
  .btn.danger:hover{background:var(--red-soft);}
  .btn.small{padding:6px 11px;font-size:11.5px;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}
  .btn.full{width:100%;}

  .grid{display:grid;gap:14px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:920px){.grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:760px){.sidebar{width:76px;} .brand .tag,.brand .mark,.nav-item span:not(.num),.who,.sync-pill,.signout{display:none;} .main{padding:20px;}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  .stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--ink-faint);font-weight:600;margin-bottom:8px;}
  .stat-value{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--ink);}
  .stat-value.pos{color:var(--green);} .stat-value.neg{color:var(--red);}
  .stat-sub{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
  .section-title{font-family:'Fraunces',serif;font-weight:600;font-size:15px;margin:26px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}

  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.8px;color:var(--ink-faint);font-weight:600;padding:10px 12px;background:var(--paper-alt);border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;}
  thead th:hover{color:var(--ink);}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--paper-alt);}
  .amt{font-family:'IBM Plex Mono',monospace;font-weight:600;white-space:nowrap;}
  .amt.pos{color:var(--green);} .amt.neg{color:var(--red);}
  .tag-chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;background:var(--paper-alt);color:var(--ink-soft);border:1px solid var(--line);}
  .tag-chip.personal{background:var(--green-soft);color:var(--green);border-color:transparent;}
  .tag-chip.business{background:var(--gold-soft);color:#8A6415;border-color:transparent;}
  .tag-chip.owner{background:var(--gold-soft);color:#8A6415;border-color:transparent;}
  .tag-chip.editor{background:var(--green-soft);color:var(--green);border-color:transparent;}
  .tag-chip.viewer{background:var(--paper-alt);color:var(--ink-soft);}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .icon-btn{background:none;border:1px solid var(--line-strong);border-radius:var(--radius);width:26px;height:26px;cursor:pointer;color:var(--ink-soft);font-size:12px;display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{background:var(--paper-alt);}
  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-faint);font-size:13px;}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
  input,select,textarea{font-family:'Inter',sans-serif;font-size:13px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--card);color:var(--ink);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
  .toolbar input[type=text],.toolbar input[type=search]{width:200px;}
  label{font-size:11.5px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px;letter-spacing:0.2px;}
  .field{margin-bottom:13px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .overlay{position:fixed;inset:0;background:rgba(28,35,51,0.45);display:none;align-items:flex-start;justify-content:center;padding:50px 20px;z-index:50;overflow:auto;}
  .overlay.open{display:flex;}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);width:100%;max-width:460px;padding:22px 24px 20px;box-shadow:0 12px 40px rgba(0,0,0,0.2);}
  .modal h3{font-family:'Fraunces',serif;font-size:18px;margin:0 0 16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .bar-track{background:var(--paper-alt);border:1px solid var(--line);border-radius:20px;height:8px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--gold);}
  .bar-fill.over{background:var(--red);} .bar-fill.good{background:var(--green);}

  .pref-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);}
  .pref-row:last-child{border-bottom:none;}
  .pref-rank{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--ink-faint);width:22px;text-align:center;}
  .pref-cutoff{border-top:2px dashed var(--red);position:relative;margin:4px 0;}
  .pref-cutoff span{position:absolute;top:-9px;left:12px;background:var(--card);padding:0 8px;font-size:10px;letter-spacing:0.6px;text-transform:uppercase;color:var(--red);font-weight:700;}
  .pref-status{font-size:10.5px;font-weight:700;letter-spacing:0.4px;padding:2px 8px;border-radius:20px;}
  .pref-status.funded{background:var(--green-soft);color:var(--green);}
  .pref-status.deferred{background:var(--red-soft);color:var(--red);}

  .settings-block{max-width:560px;}
  .helptext{font-size:12px;color:var(--ink-faint);margin-top:5px;line-height:1.55;}
  .kbd{font-family:'IBM Plex Mono',monospace;background:var(--paper-alt);padding:1px 5px;border-radius:3px;font-size:11.5px;}
  .divider{height:1px;background:var(--line);margin:22px 0;}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:var(--radius);font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,0.25);opacity:0;transform:translateY(8px);transition:all .25s ease;z-index:100;pointer-events:none;max-width:320px;}
  .toast.show{opacity:1;transform:translateY(0);}

  /* Login screen */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--ink);}
  .login-card{background:var(--card);border-radius:4px;padding:36px 34px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.35);}
  .login-card .mark{font-family:'Fraunces',serif;font-weight:700;font-size:26px;color:var(--ink);margin-bottom:4px;}
  .login-card .tag{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:22px;}
  .login-tabs{display:flex;gap:4px;margin-bottom:18px;background:var(--paper-alt);border-radius:4px;padding:3px;}
  .login-tab{flex:1;text-align:center;padding:7px;font-size:12px;font-weight:600;border-radius:3px;cursor:pointer;color:var(--ink-soft);}
  .login-tab.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}
  .login-err{background:var(--red-soft);color:var(--red);font-size:12px;padding:9px 11px;border-radius:3px;margin-bottom:14px;display:none;}
  .login-err.show{display:block;}

  ::selection{background:var(--gold-soft);}

  body[data-theme="dark"]{
    --paper:#14181F; --paper-alt:#1B212C; --card:#1D232E;
    --ink:#EDE9DC; --ink-soft:#B7BAC4; --ink-faint:#7C8291;
    --line:#2B3140; --line-strong:#3A4152;
  }
  body[data-theme="dark"] .sidebar{background:#0F131A;}

  @media print{
    .sidebar, .page-head button, .toolbar, .btn, .who, .sync-pill, .signout{display:none !important;}
    .main{padding:0 !important;max-width:none !important;}
    body{background:#fff;color:#000;}
    #reportPrintArea{display:block !important;}
  }

  /* PIN lock */
  .pin-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);}
  .pin-card{background:var(--card);padding:34px;border-radius:4px;text-align:center;width:100%;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,0.35);}
  .pin-dots{display:flex;gap:10px;justify-content:center;margin:16px 0 20px;}
  .pin-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-strong);}
  .pin-dot.filled{background:var(--gold);border-color:var(--gold);}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .pin-key{padding:16px 0;font-size:18px;font-weight:600;border:1px solid var(--line-strong);border-radius:4px;background:var(--paper-alt);cursor:pointer;color:var(--ink);}
  .pin-key:hover{background:var(--paper);}
</style>
</head>
<body>

<div id="root"></div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   AUTH + STATE
========================================================= */
const AUTH_KEY = 'ledgerAuth_v2';
const STORAGE_KEY = 'ledgerFinanceState_v2';
const DEFAULT_STATE = {
  transactions: [], budgets: [], goals: [], investments: [], preferences: [],
  accounts: [], categories: [], loans: [], loanPayments: [], exchangeRates: [],
  settings: { autoSync:true, currency:'GHS', prefBudget:0, darkMode:false, pinHash:'', ratesFetchedAt:null },
  users: [], log: [],
  lastSynced: null
};
let auth = loadAuth();      // {url, email, code, role, name}
let state = loadState();
let currentTab = 'dashboard';
let sortState = {};
let editing = null;

function loadAuth(){
  try{ const raw = localStorage.getItem(AUTH_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function saveAuth(){ localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); }
function clearAuth(){ localStorage.removeItem(AUTH_KEY); auth=null; }

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return structuredClone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    return Object.assign(structuredClone(DEFAULT_STATE), parsed, { settings: Object.assign({}, DEFAULT_STATE.settings, parsed.settings||{}) });
  }catch(e){ return structuredClone(DEFAULT_STATE); }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  if(state.settings.autoSync && auth && canEdit()) debouncedPush();
}
let pushTimer=null;
function debouncedPush(){ clearTimeout(pushTimer); pushTimer=setTimeout(()=>pushToSheet(true), 1200); }

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(n){
  const v = Number(n)||0;
  const sym = state.settings.currency==='GHS' ? '\u20B5' : (state.settings.currency==='USD'?'$':(state.settings.currency==='NGN'?'\u20A6':(state.settings.currency==='EUR'?'\u20AC':state.settings.currency+' ')));
  return sym + v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function moneyIn(n, ccy){
  const v = Number(n)||0;
  const c = ccy || state.settings.currency;
  const sym = c==='GHS' ? '\u20B5' : (c==='USD'?'$':(c==='NGN'?'\u20A6':(c==='EUR'?'\u20AC':(c==='GBP'?'\u00A3':c+' '))));
  return sym + v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),2800);
}
function canEdit(){ return auth && (auth.role==='Editor'||auth.role==='Owner'); }
function isOwner(){ return auth && auth.role==='Owner'; }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return ''; const dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
function isThisMonth(dateStr){ const d=new Date(dateStr), n=new Date(); return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth(); }

/* =========================================================
   BOOTSTRAP — handle invite links, then decide login vs app
========================================================= */
async function bootstrap(){
  applyTheme();
  const params = new URLSearchParams(window.location.search);
  if(params.has('u') && params.has('e') && params.has('c')){
    const url = params.get('u'), email = params.get('e'), code = params.get('c');
    history.replaceState({}, '', window.location.pathname);
    const res = await attemptLogin(url, email, code);
    if(res.ok){ renderRoot(); processRecurringTransactions(); return; }
  }
  if(auth && auth.url && auth.email && auth.code){
    renderRoot();
    processRecurringTransactions();
    pullFromSheet(true); // refresh in background
  } else {
    renderRoot();
  }
}

async function attemptLogin(url, email, code, name){
  try{
    const u = new URL(url);
    u.searchParams.set('email', email);
    u.searchParams.set('code', code);
    const res = await fetch(u.toString());
    const json = await res.json();
    if(!json.ok) return { ok:false, error: json.error };
    auth = { url, email, code, role: json.role, name: json.name || name || email.split('@')[0] };
    saveAuth();
    ['transactions','budgets','goals','investments','preferences','accounts','categories','loans','loanPayments','exchangeRates'].forEach(k=>{ if(json.data[k]) state[k]=json.data[k]; });
    if(json.users) state.users = json.users;
    if(json.log) state.log = json.log;
    state.lastSynced = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return { ok:true };
  }catch(e){ return { ok:false, error:'Could not reach that Sheet URL. Check it and try again.' }; }
}

/* =========================================================
   ROOT RENDER
========================================================= */
function renderRoot(){
  applyTheme();
  const root = document.getElementById('root');
  if(!auth){ root.innerHTML = loginScreenHtml(); attachLoginHandlers(); return; }
  if(state.settings.pinHash && !pinUnlockedThisSession){ root.innerHTML = pinLockScreenHtml(); attachPinHandlers(); return; }
  root.innerHTML = `<div class="app">
    <div class="sidebar">
      <div class="brand"><div class="mark">The Ledger</div><div class="tag">Personal &amp; Business</div></div>
      <div class="nav" id="nav"></div>
      <div class="who"><b>${escapeHtml(auth.name)}</b>${escapeHtml(auth.email)}<div class="role-badge">${auth.role}</div></div>
      <div class="sync-pill" id="syncPill"><span class="dot"></span><span id="syncText">—</span></div>
      <div class="signout" id="signOutBtn">Switch account / sign out</div>
    </div>
    <div class="main" id="main"></div>
  </div>`;
  document.getElementById('signOutBtn').onclick = ()=>{
    if(!confirm('Sign out? You can log back in with your email and access code any time.')) return;
    clearAuth(); currentTab='dashboard'; renderRoot();
  };
  render();
}

function loginScreenHtml(){
  return `<div class="login-wrap"><div class="login-card">
    <div class="mark">The Ledger</div>
    <div class="tag">Personal &amp; Business Finance</div>
    <div class="login-err" id="loginErr"></div>
    <div class="field"><label>Google Sheet connection URL</label><input type="text" id="l_url" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <div class="field-row">
      <div class="field"><label>Your name</label><input type="text" id="l_name" placeholder="Kwame"></div>
      <div class="field"><label>Your email</label><input type="text" id="l_email" placeholder="you@email.com"></div>
    </div>
    <div class="field"><label>Access code</label><input type="text" id="l_code" placeholder="Owner code, or the code you were emailed"></div>
    <button class="btn full" id="l_submit">Enter</button>
    <div class="helptext">First time setting this up? Deploy the included <span class="kbd">AppsScript.gs</span> to a Google Sheet, set an <span class="kbd">ADMIN_CODE</span> in its Script Properties, then enter that URL and code above — you'll become the Owner automatically. Everyone you invite afterward gets their own emailed code.</div>
  </div></div>`;
}
function attachLoginHandlers(){
  document.getElementById('l_submit').onclick = async ()=>{
    const url = document.getElementById('l_url').value.trim();
    const name = document.getElementById('l_name').value.trim();
    const email = document.getElementById('l_email').value.trim();
    const code = document.getElementById('l_code').value.trim();
    const errEl = document.getElementById('loginErr');
    errEl.classList.remove('show');
    if(!url || !email || !code){ errEl.textContent='Fill in the Sheet URL, your email, and your access code.'; errEl.classList.add('show'); return; }
    const btn = document.getElementById('l_submit'); btn.disabled=true; btn.textContent='Connecting…';
    const res = await attemptLogin(url, email, code, name);
    btn.disabled=false; btn.textContent='Enter';
    if(!res.ok){ errEl.textContent=res.error||'Could not log in — check your details.'; errEl.classList.add('show'); return; }
    renderRoot();
    toast('Welcome, '+auth.name);
  };
}

/* =========================================================
   NAV
========================================================= */
function tabs(){
  const t = [
    {id:'dashboard', label:'Dashboard', n:'01'},
    {id:'transactions', label:'Transactions', n:'02'},
    {id:'accounts', label:'Accounts', n:'03'},
    {id:'categories', label:'Categories', n:'04'},
    {id:'budgets', label:'Budgets', n:'05'},
    {id:'goals', label:'Goals & Planning', n:'06'},

function renderNav(){

  nav.innerHTML='';
  tabs().forEach(t=>{

    el.className='nav-item'+(currentTab===t.id?' active':'');

    nav.appendChild(el);

function updateSyncPill(){
  const pill=document.getElementById('syncPill'); if(!pill) return;
  const txt=document.getElementById('syncText');
  pill.classList.remove('connected');
  if(state.lastSynced){ pill.classList.add('connected'); txt.textContent='Synced '+timeAgo(state.lastSynced); }
  else txt.textContent='Not synced yet';
}
function timeAgo(iso){
  const s=Math.floor((Date.now()-new Date(iso).getTime())/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

/* ---------- Currency conversion ---------- */
function accountCurrency(accountName){
  const acc = state.accounts.find(a=>a.name===accountName);
  return acc ? acc.currency : state.settings.currency;
}
function rateFor(fromCcy, toCcy){
  if(!fromCcy || !toCcy || fromCcy===toCcy) return 1;
  const direct = state.exchangeRates.find(r=>r.fromCurrency===fromCcy && r.toCurrency===toCcy);
  if(direct) return Number(direct.rate)||1;
  const inverse = state.exchangeRates.find(r=>r.fromCurrency===toCcy && r.toCurrency===fromCcy);
  if(inverse && Number(inverse.rate)) return 1/Number(inverse.rate);
  return null; // unknown — caller should flag this
}
function toBase(amount, fromCcy){
  const base = state.settings.currency;
  const r = rateFor(fromCcy, base);
  return r===null ? Number(amount)||0 : (Number(amount)||0) * r; // falls back to face value if no rate, flagged elsewhere
}
function accountNames(){ return state.accounts.map(a=>a.name); }
function accountOptionsHtml(selected){
  const names = accountNames();
  if(names.length===0) return `<option value="">No accounts yet — add one first</option>`;
  return names.map(n=>`<option ${n===selected?'selected':''}>${escapeHtml(n)}</option>`).join('');
}
function categoryDatalistHtml(type){
  const cats = state.categories.filter(c=> !type || c.type===type);
  return `<datalist id="categoryOptions">${cats.map(c=>`<option value="${escapeHtml(c.name)}">`).join('')}</datalist>`;
}

/* ---------- Dashboard ---------- */
function computeTotals(account){
  const txs = state.transactions.filter(t=> account==='all' ? true : t.account===account);
  const income = txs.filter(t=>t.type==='Income').reduce((s,t)=>s+Number(t.amount||0),0);
  const expense = txs.filter(t=>t.type==='Expense').reduce((s,t)=>s+Number(t.amount||0),0);
  return {income, expense, net: income-expense};
}
// Same as computeTotals but converts each transaction into the base currency
// (Settings > base currency) using stored/fetched exchange rates first.
function computeTotalsBase(account){
  const txs = state.transactions.filter(t=> account==='all' ? true : t.account===account);
  let income=0, expense=0, unrated=false;
  txs.forEach(t=>{
    const ccy = accountCurrency(t.account);
    const r = rateFor(ccy, state.settings.currency);
    if(r===null) unrated=true;
    const converted = toBase(t.amount, ccy);
    if(t.type==='Income') income+=converted; else if(t.type==='Expense') expense+=converted;
  });
  return {income, expense, net: income-expense, unrated};
}

    const exp = state.transactions.filter(t=>{const dt=new Date(t.date);return t.type==='Expense'&&dt.getFullYear()===y&&dt.getMonth()===mo;}).reduce((s,t)=>s+toBase(t.amount, accountCurrency(t.account)),0);

/* ---------- Sort helper ---------- */
function sortRows(rows, entity, defaultKey){
  const s = sortState[entity] || {key:defaultKey, dir:-1};
  return [...rows].sort((a,b)=>{
    let av=a[s.key], bv=b[s.key];
    if(['amount','monthlyLimit','targetAmount','currentAmount','amountInvested','currentValue','estimatedCost','rank'].includes(s.key)){ av=Number(av)||0; bv=Number(bv)||0; }
    if(av<bv) return -1*s.dir; if(av>bv) return 1*s.dir; return 0;
  });
}
function setSort(entity,key,defaultDir){
  const cur = sortState[entity];
  if(cur && cur.key===key) cur.dir*=-1; else sortState[entity]={key, dir:defaultDir||1};
  render();
}

/* ---------- Insights (rule-based, not AI) ---------- */
function monthTotal(type, monthsAgo){
  const now=new Date(); const d=new Date(now.getFullYear(), now.getMonth()-monthsAgo, 1);
  return state.transactions.filter(t=>{ const dt=new Date(t.date); return t.type===type && dt.getFullYear()===d.getFullYear() && dt.getMonth()===d.getMonth(); }).reduce((s,t)=>s+Number(t.amount||0),0);
}
function categoryMonthTotal(category, monthsAgo){
  const now=new Date(); const d=new Date(now.getFullYear(), now.getMonth()-monthsAgo, 1);
  return state.transactions.filter(t=>{ const dt=new Date(t.date); return t.type==='Expense' && t.category===category && dt.getFullYear()===d.getFullYear() && dt.getMonth()===d.getMonth(); }).reduce((s,t)=>s+Number(t.amount||0),0);
}
function computeInsights(){
  const insights = [];
  const thisM = monthTotal('Expense',0), lastM = monthTotal('Expense',1);
  if(lastM>0){
    const pct = ((thisM-lastM)/lastM)*100;
    if(Math.abs(pct)>=5) insights.push(`Overall spending is ${pct>0?'up':'down'} ${Math.abs(pct).toFixed(0)}% this month vs last month (${money(thisM)} vs ${money(lastM)}).`);
  }
  const cats = [...new Set(state.transactions.filter(t=>t.type==='Expense').map(t=>t.category))];
  cats.forEach(cat=>{
    const m0=categoryMonthTotal(cat,0), m1=categoryMonthTotal(cat,1), m2=categoryMonthTotal(cat,2);
    if(m1>0){ const pct=((m0-m1)/m1)*100; if(pct>=20) insights.push(`${cat||'Uncategorized'} spending rose ${pct.toFixed(0)}% this month (${money(m0)} vs ${money(m1)}).`); }
    if(m0>0 && m1>0 && m2>0 && m0>m1 && m1>m2) insights.push(`${cat||'Uncategorized'} expenses have risen for three straight months.`);
  });
  state.budgets.forEach(b=>{
    const spent = state.transactions.filter(t=>t.type==='Expense'&&t.category===b.category&&t.account===b.account&&isThisMonth(t.date)).reduce((s,t)=>s+Number(t.amount||0),0);
    const limit = Number(b.monthlyLimit)||0;
    if(limit>0 && spent>=limit) insights.push(`You've exceeded your ${b.category} budget for ${b.account} (${money(spent)} of ${money(limit)}).`);
    else if(limit>0 && spent/limit>=0.85) insights.push(`You're at ${Math.round(spent/limit*100)}% of your ${b.category} budget for ${b.account}.`);
  });
  state.goals.forEach(g=>{
    const remaining = Number(g.targetAmount||0)-Number(g.currentAmount||0);
    if(remaining<=0) return;
    if(g.deadline){
      const days = Math.ceil((new Date(g.deadline)-new Date())/86400000);
      if(days>0 && days<=30) insights.push(`"${g.name}" is due in ${days} day${days!==1?'s':''} — ${money(remaining)} still needed.`);
    }
  });
  state.loans.forEach(l=>{
    if(l.status==='Paid') return;
    const bal = loanBalance(l);
    if(bal<=0) return;
    if(l.dueDate){
      const days = Math.ceil((new Date(l.dueDate)-new Date())/86400000);
      if(days<=14) insights.push(`Loan ${l.direction==='Lent'?'to':'from'} ${l.counterparty} ${days<0?'is overdue':'is due in '+days+' day(s)'} — ${money(bal)} outstanding.`);
    }
  });
  const todayHasTx = state.transactions.some(t=>t.date===new Date().toISOString().slice(0,10));
  if(!todayHasTx) insights.push(`No transaction logged today yet.`);
  return insights;
}
function renderInsights(){
  const insights = computeInsights();
  return `

}

function openModal(){ document.getElementById('overlay').classList.add('open'); }
function closeModal(){ document.getElementById('overlay').classList.remove('open'); editing=null; }
function collectForm(entity){
  const map = {
    transactions:['date','type','account','category','amount','description','tags','recurring'],
    budgets:['category','account','monthlyLimit','notes'],
    goals:['name','account','kind','targetAmount','currentAmount','deadline','notes'],
    investments:['name','assetType','account','amountInvested','currentValue','date','notes'],
    preferences:['item','category','rank','estimatedCost','notes'],
    accounts:['name','type','currency','openingBalance','status'],
    categories:['name','type'],
    loans:['direction','counterparty','principal','currency','interestRate','startDate','dueDate','status','notes'],
    loanPayments:['loanId','date','amount','notes']
  };
  const obj={}; map[entity].forEach(k=>{ const el=document.getElementById('f_'+k); if(el) obj[k]=el.value; }); return obj;
}
function addInterval(dateStr, unit){
  const d = new Date(dateStr);
  if(unit==='Weekly') d.setDate(d.getDate()+7);
  else if(unit==='Monthly') d.setMonth(d.getMonth()+1);
  else if(unit==='Yearly') d.setFullYear(d.getFullYear()+1);
  return d.toISOString().slice(0,10);
}
function saveModal(){
  const {entity,id} = editing;
  const data = collectForm(entity);
  if(entity==='transactions' && data.recurring){ data.nextDueDate = addInterval(data.date, data.recurring); }
  if(id){ const list = state[entity]; const idx = list.findIndex(x=>x.id===id); list[idx] = Object.assign({}, list[idx], data); }
  else{ data.id = uid(); data.createdAt = new Date().toISOString(); state[entity].push(data); }
  saveState(); closeModal(); render(); toast('Saved');
}
function processRecurringTransactions(){
  const today = new Date().toISOString().slice(0,10);
  let generated = 0;
  state.transactions.slice().forEach(t=>{
    if(t.recurring && t.nextDueDate && t.nextDueDate <= today){
      const copy = Object.assign({}, t, { id: uid(), date: t.nextDueDate, createdAt: new Date().toISOString() });
      copy.nextDueDate = addInterval(copy.date, copy.recurring);
      state.transactions.push(copy);
      const orig = state.transactions.find(x=>x.id===t.id);
      if(orig) orig.nextDueDate = copy.nextDueDate;
      generated++;
    }
  });
  if(generated>0){ saveState(); toast(generated+' recurring transaction'+(generated>1?'s':'')+' added'); }
}

/* =========================================================
   GOOGLE SHEETS SYNC
========================================================= */
async function pullFromSheet(silent){
  if(!auth) return;
  try{
    const u = new URL(auth.url);
    u.searchParams.set('email', auth.email); u.searchParams.set('code', auth.code);
    const res = await fetch(u.toString());
    const json = await res.json();
    if(!json.ok){ if(!silent) toast('Sync failed: '+json.error); return; }
    ['transactions','budgets','goals','investments','preferences','accounts','categories','loans','loanPayments','exchangeRates'].forEach(k=>{ if(json.data[k]) state[k]=json.data[k]; });
    if(json.users) state.users = json.users;
    if(json.log) state.log = json.log;
    auth.role = json.role; saveAuth();
    state.lastSynced = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    render();
    if(!silent) toast('Pulled latest data');
  }catch(e){ if(!silent) toast('Could not reach the Sheet'); }
}
async function pushToSheet(silent){
  if(!auth || !canEdit()) return;
  try{
    const payload = { email:auth.email, code:auth.code, action:'sync',
      data:{ transactions:state.transactions, budgets:state.budgets, goals:state.goals, investments:state.investments, preferences:state.preferences,
             accounts:state.accounts, categories:state.categories, loans:state.loans, loanPayments:state.loanPayments, exchangeRates:state.exchangeRates } };
    const res = await fetch(auth.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload) });
    const json = await res.json();
    if(!json.ok){ if(!silent) toast('Push failed: '+json.error); return; }
    state.lastSynced = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    updateSyncPill();
    if(!silent) toast('Pushed to Google Sheet');
  }catch(e){ if(!silent) toast('Could not reach the Sheet'); }
}
async function pushThenPull(){ await pushToSheet(true); await pullFromSheet(false); }

async function sendInvite(){
  const name = document.getElementById('inv_name').value.trim();
  const email = document.getElementById('inv_email').value.trim();
  const role = document.getElementById('inv_role').value;

}

function exportCsv(filename, rows){
  if(!rows || rows.length===0){ toast('Nothing to export'); return; }
  const headers = Object.keys(rows[0]);
  const escCsv = (v)=>{ const s=String(v??''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const csv = [headers.join(',')].concat(rows.map(r=>headers.map(h=>escCsv(r[h])).join(','))).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function exportXlsx(){
  const wb = XLSX.utils.book_new();
  ['transactions','budgets','goals','investments','preferences'].forEach(k=>{
    const ws = XLSX.utils.json_to_sheet(state[k]);
    XLSX.utils.book_append_sheet(wb, ws, k.charAt(0).toUpperCase()+k.slice(1));
  });
  XLSX.writeFile(wb, 'ledger-finance-backup-'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Backup exported');
}
function importXlsx(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const wb = XLSX.read(evt.target.result, {type:'array'});
      ['transactions','budgets','goals','investments','preferences'].forEach(k=>{
        const sheetName = k.charAt(0).toUpperCase()+k.slice(1);
        if(wb.Sheets[sheetName]){ const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName]); state[k] = rows.map(r=>({...r, id: r.id?String(r.id):uid()})); }
      });
      saveState(); render(); toast('Backup imported');
    }catch(err){ toast('Import failed — check the file'); }
  };
  reader.readAsArrayBuffer(file); e.target.value='';
}

/* =========================================================
   LIVE EXCHANGE RATES
========================================================= */
async function fetchLiveRates(){
  if(!auth) return;
  try{
    const u = new URL(auth.url);
    u.searchParams.set('email', auth.email); u.searchParams.set('code', auth.code);
    u.searchParams.set('action','rates'); u.searchParams.set('base', state.settings.currency);
    const res = await fetch(u.toString());
    const json = await res.json();
    if(!json.ok){ toast('Could not fetch rates: '+json.error); return; }
    const wantedCurrencies = new Set(state.accounts.map(a=>a.currency).concat([state.settings.currency]));
    wantedCurrencies.forEach(ccy=>{
      if(ccy===state.settings.currency || !json.rates[ccy]) return;
      // json.rates[ccy] = units of ccy per 1 base; we store rate as ccy -> base
      const rate = 1/json.rates[ccy];
      const existingIdx = state.exchangeRates.findIndex(r=>r.fromCurrency===ccy && r.toCurrency===state.settings.currency);
      const row = { id: existingIdx>=0?state.exchangeRates[existingIdx].id:uid(), fromCurrency:ccy, toCurrency:state.settings.currency, rate, updatedAt:new Date().toISOString() };
      if(existingIdx>=0) state.exchangeRates[existingIdx]=row; else state.exchangeRates.push(row);
    });
    state.settings.ratesFetchedAt = new Date().toISOString();
    saveState(); render(); toast('Exchange rates updated');
  }catch(e){ toast('Could not reach the rate service'); }
}

/* =========================================================
   PIN LOCK (device convenience lock, not encryption)
========================================================= */
let pinUnlockedThisSession = false;
let pinBuffer = '';
async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function setupPin(){
  const pin = prompt('Choose a 4-6 digit PIN for this device:');
  if(!pin || !/^\d{4,6}$/.test(pin)){ if(pin!==null) toast('PIN must be 4-6 digits'); return; }
  state.settings.pinHash = await sha256Hex(pin);
  saveState(); render(); toast('PIN lock enabled');
}
function pinLockScreenHtml(){
  return `<div class="pin-wrap"><div class="pin-card">
    <div class="mark" style="font-family:'Fraunces',serif;font-weight:700;font-size:20px;color:var(--ink);margin-bottom:4px;">Enter PIN</div>
    <div class="pin-dots" id="pinDots">${[0,1,2,3].map(()=>'<div class="pin-dot"></div>').join('')}</div>
    <div class="pin-pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pin-key" data-pin="${n}">${n}</button>`).join('')}
      <button class="pin-key" data-pin="clear">Clear</button>
      <button class="pin-key" data-pin="0">0</button>
      <button class="pin-key" data-pin="back">⌫</button>
    </div>
  </div></div>`;
}
async function checkPinBuffer(){
  const hash = await sha256Hex(pinBuffer);
  if(hash === state.settings.pinHash){ pinUnlockedThisSession = true; renderRoot(); }
  else{ pinBuffer=''; renderPinDots(); toast('Incorrect PIN'); }
}
function renderPinDots(){
  const dots = document.querySelectorAll('#pinDots .pin-dot');
  dots.forEach((d,i)=> d.classList.toggle('filled', i<pinBuffer.length));
}
function attachPinHandlers(){
  document.querySelectorAll('[data-pin]').forEach(btn=>{
    btn.onclick=()=>{
      const v = btn.dataset.pin;
      if(v==='clear') pinBuffer='';
      else if(v==='back') pinBuffer=pinBuffer.slice(0,-1);
      else if(pinBuffer.length<6) pinBuffer+=v;
      renderPinDots();
      if(pinBuffer.length>=4) checkPinBuffer();
    };
  });
}
