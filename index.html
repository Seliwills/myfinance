    '<div class="modal-head"><h3>Workspace Access</h3><div class="icon-btn" onclick="closeModal()">'+iconSvg('x')+'</div></div>' +
    '<div style="display:flex;flex-direction:column;gap:8px;">' +
      accessibleWorkspaces().map(function(ws){ return '<label style="display:flex;align-items:center;gap:8px;font-size:13.5px;"><input type="checkbox" class="access-ws" value="'+ws.id+'" '+(grants.indexOf(ws.id)>-1?'checked':'')+'> '+escapeHtml(ws.name)+'</label>'; }).join('') +
    '</div>' +
    '<span class="btn btn-primary btn-block" style="margin-top:14px;" onclick="saveWorkspaceAccess(\''+userId+'\')">Save</span>'
  );
}
function saveWorkspaceAccess(userId){
  const workspaceIds = Array.from(document.querySelectorAll('.access-ws:checked')).map(function(el){return el.value;});
  callServer('setWorkspaceAccess', { userId:userId, workspaceIds:workspaceIds }).then(function(res){
    if (!res.ok) return toast(res.error||'Failed', 'error');
    toast('Access updated', 'success'); closeModal(); pullAll();
  });
}
function removePerson(id){
  if (!confirm('Remove this person\'s access?')) return;
  callServer('removeUser', { id:id }).then(function(res){
    if (!res.ok) return toast(res.error||'Failed', 'error');
    toast('Removed', 'success'); pullAll();
  });
}

/* ---------------------------------------------------------------------
   SETTINGS
   --------------------------------------------------------------------- */
function renderSettings(){
  return '' +
  '<div class="settings-section-label">General</div>' +
  '<div class="card">' +
    settingsTile('coins', 'Base Currency', S.baseCurrency, iconSvg('chevron-right'), 'openBaseCurrencyModal()') +
    settingsTile(S.theme==='dark'?'moon':'sun', 'Dark mode', S.theme==='dark'?'On':'Off', toggleHtml(S.theme==='dark','toggleTheme()'), null) +
    settingsTile(S.showBalances?'eye':'eye-off', 'Hide balances', S.showBalances?'Off':'On', toggleHtml(!S.showBalances,'toggleBalances()'), null) +
  '</div>' +

  '<div class="settings-section-label">Exchange Rates</div>' +
  '<div class="card">' +
    '<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;">' +
      '<span class="muted" style="font-size:12px;">Rates against '+S.baseCurrency+' update automatically'+(latestRateTime()?' — last updated '+fmtDate(latestRateTime()):'')+'.</span>' +
      '<span class="icon-btn" style="width:32px;height:32px;flex-shrink:0;" title="Refresh now" onclick="fetchLiveRates()">'+iconSvg('refresh-cw')+'</span>' +
    '</div>' +
    (S.lastRateError ? '<div class="pill pill-danger" style="margin-top:8px;white-space:normal;height:auto;padding:8px 10px;">'+iconSvg('alert-circle')+' '+escapeHtml(S.lastRateError)+'</div>' : '') +
    (!S.data.ExchangeRates.length && !S.lastRateError ? '<div class="pill pill-warning" style="margin-top:8px;">No rates fetched yet — will retry automatically.</div>' : '') +
    (S.data.ExchangeRates.length ? '<div style="margin-top:10px;font-size:12.5px;">'+S.data.ExchangeRates.filter(function(r){return r.fromCurrency===S.baseCurrency;}).map(function(r){return '<div style="display:flex;justify-content:space-between;padding:3px 0;"><span>'+r.fromCurrency+' → '+r.toCurrency+'</span><span class="mono">'+Number(r.rate).toFixed(4)+'</span></div>';}).join('')+'</div>' : '') +
  '</div>' +

  '<div class="settings-section-label">Security</div>' +
  '<div class="card">' +
    settingsTile('lock', 'PIN Lock', S.pinEnabled?'Enabled':'Disabled', toggleHtml(S.pinEnabled,'togglePin()'), null) +
    (S.pinEnabled ? settingsTile('key-round', 'Change PIN', 'Update your device PIN', iconSvg('chevron-right'), 'openSetPinModal()') : '') +
  '</div>' +

  '<div class="settings-section-label">Backup &amp; Data</div>' +
  '<div class="card">' +
    settingsTile('file-spreadsheet', 'Export .xlsx', 'Full backup, one sheet per entity', iconSvg('chevron-right'), 'exportXlsxBackup()') +
    settingsTile('download', 'Export CSV', 'Transactions only', iconSvg('chevron-right'), 'exportTxCsv()') +
  '</div>' +

  '<div class="settings-section-label">Server</div>' +
  '<div class="card">' +
    settingsTile('link', 'Apps Script URL', S.serverUrl ? (S.serverUrl.length>34?S.serverUrl.slice(0,34)+'…':S.serverUrl) : 'Not set', iconSvg('chevron-right'), 'openServerUrlModal()') +
    settingsTile('eraser', 'Erase local cache', 'Clears this device only — never touches the Sheet', iconSvg('chevron-right'), 'eraseLocalCache()') +
  '</div>';
}
function settingsTile(icon, title, subtitle, trailingHtml, onclick){
  return '<div class="settings-tile" '+(onclick?'onclick="'+onclick+'"':'')+'>' +
    '<div class="settings-tile-icon">'+iconSvg(icon)+'</div>' +
    '<div style="flex:1;min-width:0;"><div class="settings-tile-title">'+title+'</div>'+(subtitle?'<div class="settings-tile-sub">'+escapeHtml(subtitle)+'</div>':'')+'</div>' +
    (trailingHtml||'') +
  '</div>';
}
function openBaseCurrencyModal(){
  openModal('' +
    '<div class="modal-head"><h3>Base Currency</h3><div class="icon-btn" onclick="closeModal()">'+iconSvg('x')+'</div></div>' +
    '<div class="field"><label>Currency</label><select id="fBaseCurrency">'+CURRENCIES.map(function(c){return '<option '+(S.baseCurrency===c?'selected':'')+'>'+c+'</option>';}).join('')+'</select></div>' +
    '<span class="btn btn-primary btn-block" onclick="S.baseCurrency=document.getElementById(\'fBaseCurrency\').value;saveState();closeModal();render();autoFetchRatesIfNeeded();">Save</span>'
  );
}
function openServerUrlModal(){
  openModal('' +
    '<div class="modal-head"><h3>Apps Script URL</h3><div class="icon-btn" onclick="closeModal()">'+iconSvg('x')+'</div></div>' +
    '<div class="field"><label>Server URL</label><input id="fServerUrl" value="'+escapeHtml(S.serverUrl)+'"></div>' +
    '<span class="btn btn-primary btn-block" onclick="updateServerUrl();closeModal();">Save</span>'
  );
}
function toggleHtml(on, onclick){ return '<div class="toggle '+(on?'on':'')+'" onclick="'+onclick+'"><div class="knob"></div></div>'; }
function togglePin(){
  if (S.pinEnabled) { S.pinEnabled=false; S.pinHash=''; saveState(); render(); toast('PIN lock turned off'); }
  else openSetPinModal();
}
function openSetPinModal(){
  openModal('' +
    '<div class="modal-head"><h3>Set PIN</h3><div class="icon-btn" onclick="closeModal()">'+iconSvg('x')+'</div></div>' +
    '<div class="field"><label>New PIN (4–6 digits)</label><input id="fPin" type="password" inputmode="numeric" maxlength="6"></div>' +
    '<span class="btn btn-primary btn-block" onclick="saveSetPin()">Save</span>'
  );
}
function saveSetPin(){
  const pin = document.getElementById('fPin').value.trim();
  if (!/^\d{4,6}$/.test(pin)) return toast('PIN must be 4–6 digits', 'error');
  sha256(pin).then(function(hash){ S.pinHash = hash; S.pinEnabled = true; saveState(); closeModal(); render(); toast('PIN set', 'success'); });
}
function sha256(str){
  const enc = new TextEncoder().encode(str);
  return crypto.subtle.digest('SHA-256', enc).then(function(buf){
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  });
}
function latestRateTime(){
  const rates = (S.data.ExchangeRates||[]).filter(function(r){ return r.fromCurrency===S.baseCurrency; });
  if (!rates.length) return null;
  return rates.reduce(function(latest,r){ return (!latest || new Date(r.updatedAt)>new Date(latest)) ? r.updatedAt : latest; }, null);
}
function fetchLiveRates(){
  if (!S.serverUrl || !S.auth) return toast('Log in first', 'error');
  callServer('fetchRates', { base: S.baseCurrency, targets: CURRENCIES.filter(function(c){ return c!==S.baseCurrency; }) }).then(function(res){
    if (!res.ok) { S.lastRateError = res.error||'Failed to fetch rates'; saveState(); return toast(S.lastRateError, 'error'); }
    S.lastRateError = res.missing && res.missing.length ? ('No rate data for: ' + res.missing.join(', ')) : '';
    saveState();
    toast(res.missing && res.missing.length ? 'Rates updated (some currencies unavailable)' : 'Rates updated', res.missing && res.missing.length ? 'error' : 'success');
    pullAll();
  }).catch(function(err){ S.lastRateError = 'Network error: '+err; saveState(); toast(S.lastRateError, 'error'); });
}
function updateServerUrl(){ S.serverUrl = document.getElementById('fServerUrl').value.trim(); saveState(); toast('Server URL saved', 'success'); pullAll(); }
function eraseLocalCache(){
  if (!confirm('Erase this device\'s offline copy? Nothing on the Sheet is affected.')) return;
  const auth = S.auth, url = S.serverUrl, theme = S.theme;
  localStorage.removeItem(LS_KEY);
  S = loadState(); S.auth = auth; S.serverUrl = url; S.theme = theme; saveState();
  pullAll().then(render);
  toast('Local cache erased', 'success');
}
function exportXlsxBackup(){
  if (typeof XLSX === 'undefined') return toast('Excel export library failed to load — check your connection', 'error');
  const wb = XLSX.utils.book_new();
  ['Workspaces'].concat(ENTITIES).forEach(function(e){ XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.data[e]||[]), e); });
  XLSX.writeFile(wb, 'ledger-backup-'+todayISO()+'.xlsx');
}

/* ---------------------------------------------------------------------
   CATEGORIES (per workspace)
   --------------------------------------------------------------------- */
function renderCategoriesScreen(){
  window.__catWorkspace = window.__catWorkspace && inScope(window.__catWorkspace) ? window.__catWorkspace : S.selectedWorkspaces[0];
  const wsId = window.__catWorkspace;
  const all = S.data.Categories.filter(function(c){return c.workspaceId===wsId;});
  const income = all.filter(function(c){return c.type==='Income';});
  const expense = all.filter(function(c){return c.type==='Expense';});
  function list(arr){
    return arr.map(function(c){
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);">' +
        '<span>'+escapeHtml(c.name)+(c.isDefault?' <span class="pill pill-neutral">default</span>':'')+'</span>' +
        (canEdit()&&!c.isDefault ? '<div class="icon-btn" style="width:28px;height:28px;" onclick="localDelete(\'Categories\',\''+c.id+'\')">'+iconSvg('trash-2')+'</div>' : '') +
      '</div>';
    }).join('') || '<div class="muted" style="padding:10px 0;">None yet.</div>';
  }
  return '' +
  '<div class="field" style="max-width:280px;margin-bottom:16px;"><label>Workspace</label><select onchange="window.__catWorkspace=this.value;render();">'+workspaceSelectOptions(wsId)+'</select></div>' +
  '<div class="grid grid-2">' +
    '<div class="card"><h4 style="margin-bottom:10px;">Income Categories</h4>'+list(income)+
      (canEdit()?'<span class="btn btn-outline btn-sm" style="margin-top:12px;" onclick="openCategoryModal(\'Income\')">'+iconSvg('plus')+' Add</span>':'')+'</div>' +
    '<div class="card"><h4 style="margin-bottom:10px;">Expense Categories</h4>'+list(expense)+
      (canEdit()?'<span class="btn btn-outline btn-sm" style="margin-top:12px;" onclick="openCategoryModal(\'Expense\')">'+iconSvg('plus')+' Add</span>':'')+'</div>' +
  '</div>';
}
function openCategoryModal(type){
  openModal('' +
    '<div class="modal-head"><h3>Add '+type+' Category</h3><div class="icon-btn" onclick="closeModal()">'+iconSvg('x')+'</div></div>' +
    '<div class="field"><label>Name</label><input id="fName" placeholder="e.g. Freelance Income"></div>' +
    '<span class="btn btn-primary btn-block" onclick="saveCategoryModal(\''+type+'\')">Save</span>'
  );
}
function saveCategoryModal(type){
  const name = document.getElementById('fName').value.trim();
  if (!name) return toast('Name is required', 'error');
  localCreate('Categories', { workspaceId: window.__catWorkspace, name:name, type:type, isDefault:false });
  closeModal();
}

/* ---------------------------------------------------------------------
   PIN LOCK SCREEN
   --------------------------------------------------------------------- */
function renderPinLock(){
  return '<div class="login-wrap"><div class="login-card" style="text-align:center;">' +
    '<div class="login-logo" style="margin:0 auto 18px;">TL</div>' +
    '<h3 style="margin-bottom:6px;">Enter PIN</h3>' +
    '<p class="muted" style="font-size:12.5px;margin-bottom:18px;">This device is locked.</p>' +
    '<input id="pinInput" type="password" inputmode="numeric" maxlength="6" style="text-align:center;font-size:22px;letter-spacing:6px;" autofocus onkeydown="if(event.key===\'Enter\')tryPin();">' +
    '<button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="tryPin()">Unlock</button>' +
    '<div style="margin-top:16px;"><a href="#" onclick="event.preventDefault();forgotPin();" style="font-size:12.5px;color:var(--text-2);text-decoration:underline;">Forgot PIN? Turn it off</a></div>' +
  '</div></div>';
}
function tryPin(){
  const val = document.getElementById('pinInput').value.trim();
  sha256(val).then(function(hash){
    if (hash === S.pinHash) { window.__pinAttempts = 0; window.__pinUnlocked = true; render(); }
    else {
      window.__pinAttempts = (window.__pinAttempts||0) + 1;
      if (window.__pinAttempts >= 5) {
        const input = document.getElementById('pinInput');
        if (input) input.disabled = true;
        toast('Too many attempts. Try again in 15 seconds.', 'error');
        setTimeout(function(){ window.__pinAttempts = 0; const el = document.getElementById('pinInput'); if (el) el.disabled = false; }, 15000);
      } else {
        toast('Incorrect PIN', 'error');
      }
    }
  });
}
function forgotPin(){
  // Turning off the PIN must never permanently lock someone out of their own
  // device, but a single confirm() click is not real security — anyone who
  // picks up the phone could bypass it instantly. Requiring the account's own
  // login credentials (already known only to whoever set the PIN up) keeps
  // the "no permanent lockout" guarantee while actually gating the escape hatch.
  openModal('' +
    '<div class="modal-head"><h3>Turn off PIN lock</h3><div class="icon-btn" onclick="closeModal()">'+iconSvg('x')+'</div></div>' +
    '<p class="muted" style="font-size:13px;">Confirm your account email and access code to turn off the PIN lock on this device.</p>' +
    '<div class="field"><label>Email</label><input id="fpEmail" placeholder="you@example.com"></div>' +
    '<div class="field"><label>Access code</label><input id="fpCode" placeholder="Your login access code"></div>' +
    '<span class="btn btn-danger btn-block" onclick="confirmForgotPin()">Turn off PIN lock</span>'
  );
}
function confirmForgotPin(){
  const email = document.getElementById('fpEmail').value.trim().toLowerCase();
  const code = document.getElementById('fpCode').value.trim();
  if (!S.auth || email !== String(S.auth.email).toLowerCase() || code !== String(S.auth.code)) {
    toast('Email or access code does not match this account', 'error');
    return;
  }
  S.pinEnabled = false; S.pinHash = ''; window.__pinUnlocked = true; saveState(); closeModal(); render();
}

/* ---------------------------------------------------------------------
   MASTER RENDER + INIT
   --------------------------------------------------------------------- */
function render(){
  const app = document.getElementById('app');
  if (S.pinEnabled && !window.__pinUnlocked) { app.innerHTML = renderPinLock(); safeIcons(); return; }
  if (!S.auth) { app.innerHTML = renderLogin(); safeIcons(); return; }
  ensureSelectedWorkspaces();

  let inner = '';
  switch (S.route) {
    case 'dashboard': inner = renderDashboard(); break;
    case 'transactions': inner = renderTransactions(); break;
    case 'wallets': inner = renderWallets(); break;
    case 'workspaces': inner = renderWorkspaces(); break;
    case 'categories': inner = renderCategoriesScreen(); break;
    case 'budgets': inner = renderBudgets(); break;
    case 'goals': inner = renderGoals(); break;
    case 'loans': inner = renderLoans(); break;
    case 'investments': inner = renderInvestments(); break;
    case 'preference': inner = renderPreference(); break;
    case 'insights': inner = renderInsights(); break;
    case 'reports': inner = renderReports(); break;
    case 'people': inner = renderPeople(); break;
    case 'settings': inner = renderSettings(); break;
    default: inner = renderDashboard();
  }
  app.innerHTML = shellHtml(inner);
  updateSyncBadge();
  refreshMobileDrawerIfOpen();
  safeIcons();
}
function refreshMobileDrawerIfOpen(){
  const drawer = document.getElementById('mobileDrawer');
  if (!drawer) return;
  const panel = drawer.querySelector('.drawer-panel');
  if (panel) panel.innerHTML = sidebarInnerHtml();
}

/* PWA install prompt */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredInstallPrompt = e; });

function init(){
  document.documentElement.setAttribute('data-theme', S.theme);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(err){ console.warn('SW registration failed', err); });
  }
  render();
  if (S.auth && S.serverUrl) {
    pullAll().then(processRecurringLocally);
    setInterval(pullAll, 45000);
  }
  updateSyncBadge();
}
init();
</script>
