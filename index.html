<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00B894">
<title>The Ledger</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="The Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F7F7FB; --surface:#FFFFFF; --surface-2:#F0F0F7;
  --primary:#00B894; --accent:#4FACFE; --success:#00B894; --warning:#D68910; --danger:#E85D5D;
  --text:#16162A; --text-2:#6B6B85; --border:#E4E4F0;
  --primary-rgb:0,184,148;
  --radius:22px; --radius-sm:16px;
  --shadow-sm:0 1px 2px rgba(22,22,42,.04), 0 1px 1px rgba(22,22,42,.03);
  --shadow-md:0 8px 24px rgba(22,22,42,.06), 0 2px 6px rgba(22,22,42,.04);
  --shadow-lg:0 20px 48px rgba(22,22,42,.10), 0 6px 16px rgba(22,22,42,.06);
  --font-head:'Syne',sans-serif; --font-body:'DM Sans',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
[data-theme="dark"]{
  --bg:#0F0F23; --surface:#252545; --surface-2:#1E1E3A;
  --primary:#00D4AA; --accent:#74C0FC; --success:#00D4AA; --warning:#FFD166; --danger:#FF6B6B;
  --text:#F0F0FF; --text-2:#B0B0CC; --border:#2D2D55;
  --primary-rgb:0,212,170;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 24px rgba(0,212,170,.07), 0 2px 6px rgba(0,0,0,.35); --shadow-lg:0 20px 48px rgba(0,212,170,.10), 0 6px 16px rgba(0,0,0,.45);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{font-family:var(--font-head); margin:0; letter-spacing:-.01em;}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:rgba(var(--primary-rgb),.25);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

/* ---------- layout shell ---------- */
#app{min-height:100vh; display:flex;}
.sidebar{
  width:236px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
  padding:20px 14px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:8px 10px 22px;}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-head);font-weight:800;font-size:16px;flex-shrink:0;}
.brand-name{font-family:var(--font-head);font-weight:800;font-size:16.5px;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; cursor:pointer;
  color:var(--text-2); font-weight:600; font-size:13.5px; transition:background .15s,color .15s;
}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:rgba(var(--primary-rgb),.12); color:var(--primary);}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.nav-sep{height:1px;background:var(--border);margin:10px 6px;}
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:20; background:rgba(var(--primary-rgb),0); backdrop-filter:blur(0px);
  display:flex; align-items:center; justify-content:space-between; padding:16px 28px; gap:14px;
}
.topbar-title{font-family:var(--font-head); font-weight:800; font-size:22px;}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.content{padding:6px 28px 100px; flex:1;}
.icon-btn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2); transition:.15s;
}
.icon-btn:hover{color:var(--text); box-shadow:var(--shadow-sm);}
.icon-btn svg{width:17px;height:17px;}

/* ---------- cards / grid ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:20px;}
.card.glass{
  background:linear-gradient(135deg, rgba(var(--primary-rgb),.10), transparent 55%), var(--surface);
  box-shadow:0 10px 30px rgba(var(--primary-rgb),.08), var(--shadow-sm);
}
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));} .grid-3{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:minmax(0,1fr);}}

.stat-label{font-size:12px; font-weight:600; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em;}
.stat-value{font-family:var(--font-mono); font-weight:700; font-size:26px; margin-top:6px;}
.stat-sub{font-size:12.5px; color:var(--text-2); margin-top:4px;}
.pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
.pill-success{background:rgba(34,197,94,.14); color:var(--success);}
.pill-danger{background:rgba(239,68,68,.14); color:var(--danger);}
.pill-warning{background:rgba(245,158,11,.14); color:var(--warning);}
.pill-neutral{background:var(--surface-2); color:var(--text-2);}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px; justify-content:center; padding:10px 18px; border-radius:999px;
  font-weight:700; font-size:13.5px; cursor:pointer; border:1px solid transparent; transition:.15s; white-space:nowrap;
}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--primary); color:#fff; box-shadow:0 6px 16px rgba(var(--primary-rgb),.28);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:var(--surface-2); color:var(--text);}
.btn-ghost:hover{background:var(--border);}
.btn-outline{background:transparent;border:1px solid var(--border); color:var(--text);}
.btn-danger{background:rgba(239,68,68,.12); color:var(--danger);}
.btn-sm{padding:7px 13px; font-size:12.5px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

/* ---------- forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--text-2); margin-bottom:6px;}
input,select,textarea{
  width:100%; padding:11px 13px; border-radius:12px; border:1px solid var(--border); background:var(--surface);
  color:var(--text); font-family:inherit; font-size:14px; outline:none; transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(var(--primary-rgb),.15);}
textarea{resize:vertical; min-height:70px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.toggle{position:relative; width:44px; height:26px; border-radius:999px; background:var(--border); cursor:pointer; flex-shrink:0; transition:.15s;}
.toggle.on{background:var(--primary);}
.toggle .knob{position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.15s; box-shadow:var(--shadow-sm);}
.toggle.on .knob{left:21px;}

/* ---------- table ---------- */
table{width:100%; border-collapse:collapse;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-2); font-weight:700; padding:10px 12px; border-bottom:1px solid var(--border);}
td{padding:12px; border-bottom:1px solid var(--border); font-size:13.5px;}
tr:last-child td{border-bottom:none;}
tr.row-hover:hover{background:var(--surface-2);}

/* ---------- modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(2,6,23,.5); backdrop-filter:blur(3px); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
@media (min-width:720px){.overlay{align-items:center;}}
.modal{background:var(--surface); border-radius:24px 24px 0 0; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; padding:24px; box-shadow:var(--shadow-lg); animation:slideUp .22s ease;}
@media (min-width:720px){.modal{border-radius:24px;}}
@keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}

/* ---------- misc ---------- */
.muted{color:var(--text-2);}
.empty{text-align:center; padding:48px 20px; color:var(--text-2);}
.empty svg{width:38px;height:38px; margin-bottom:10px; opacity:.5;}
.divider{height:1px; background:var(--border); margin:16px 0;}
.badge-dot{width:8px;height:8px;border-radius:50%; display:inline-block;}
.tabs{display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:12px; width:fit-content; margin-bottom:16px;}
.tab{padding:8px 16px; border-radius:9px; font-weight:700; font-size:12.5px; cursor:pointer; color:var(--text-2);}
.tab.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm);}
.fab{position:fixed; bottom:84px; right:20px; width:56px; height:56px; border-radius:50%; background:var(--primary); color:#fff; display:none; align-items:center; justify-content:center; box-shadow:var(--shadow-lg); z-index:40; cursor:pointer;}
.fab svg{width:24px;height:24px;}
.blur-balance{filter:blur(7px); user-select:none;}
.progress-track{height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden;}
.progress-fill{height:100%; border-radius:999px; transition:width .3s;}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(var(--primary-rgb),.25);border-top-color:var(--primary);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast-wrap{position:fixed; top:18px; right:18px; z-index:300; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--text); color:var(--bg); padding:12px 16px; border-radius:12px; font-size:13px; font-weight:600; box-shadow:var(--shadow-lg); animation:slideIn .2s ease; max-width:320px;}
@keyframes slideIn{from{transform:translateX(20px);opacity:0;} to{transform:translateX(0);opacity:1;}}

/* ---------- bottom nav (mobile) — FinFlow-style floating pill ---------- */
.bottom-nav{display:none;}
.menu-btn{display:none;}
.drawer-overlay{position:fixed; inset:0; background:rgba(2,6,23,.5); backdrop-filter:blur(3px); z-index:200; display:flex;}
.drawer-panel{width:270px; max-width:82vw; height:100%; background:var(--surface); box-shadow:var(--shadow-lg); padding:16px 12px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; animation:drawerIn .2s ease;}
@keyframes drawerIn{from{transform:translateX(-16px);opacity:0;} to{transform:translateX(0);opacity:1;}}
@media (min-width:901px){ .fab{display:flex;} }
@media (max-width:900px){
  .sidebar{display:none;}
  .content{padding:6px 16px 110px;}
  .topbar{padding:14px 16px;}
  .menu-btn{display:flex;}
  .fab{display:none !important;}
  .bottom-nav{
    display:flex; position:fixed; left:12px; right:12px; bottom:16px; z-index:50; background:var(--surface);
    border:1px solid var(--border); border-radius:28px; height:70px; padding:0 6px;
    justify-content:space-around; align-items:center;
    box-shadow:0 12px 32px rgba(0,0,0,.28), 0 4px 12px rgba(0,0,0,.18);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav .nav-item{flex-direction:column; gap:3px; font-size:9.5px; padding:6px 4px; flex:1; text-align:center; border-radius:12px; color:var(--text-2);}
  .bottom-nav .nav-item.active{background:transparent; color:var(--primary);}
  .bottom-nav .nav-item.active svg{color:var(--primary);}
  .bottom-nav-center{
    flex-shrink:0; width:48px; height:48px; border-radius:16px; margin:0 4px;
    background:linear-gradient(135deg, var(--primary), #00A080);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 6px 16px rgba(var(--primary-rgb),.4);
  }
  .bottom-nav-center svg{width:22px;height:22px;color:#0F0F23;}
}

/* mobile card-list table replacement */
@media (max-width:720px){
  .responsive-table thead{display:none;}
  .responsive-table, .responsive-table tbody, .responsive-table tr, .responsive-table td{display:block; width:100%;}
  .responsive-table tr{background:var(--surface); border:1px solid var(--border); border-radius:16px; margin-bottom:10px; padding:10px 4px;}
  .responsive-table td{border-bottom:none; padding:6px 12px; display:flex; justify-content:space-between; gap:10px; font-size:13px;}
  .responsive-table td::before{content:attr(data-label); font-weight:700; color:var(--text-2); font-size:11px; text-transform:uppercase; letter-spacing:.03em;}
}

.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); padding:20px;}
.login-card{width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border); border-radius:26px; padding:32px; box-shadow:var(--shadow-lg);}
.login-logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-head);font-weight:800;font-size:22px; margin-bottom:16px;}

/* ---------- FinFlow-structure components ---------- */
.greeting-title{font-family:var(--font-head); font-weight:800; font-size:21px;}
.greeting-sub{color:var(--text-2); font-size:13px; margin-top:2px;}

.ws-chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--border); cursor:pointer;}
.ws-chip-mark{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.ws-chip-mark svg{width:11px;height:11px;}
.ws-chip span.label{font-family:var(--font-head); font-weight:700; font-size:12.5px;}

.hero-card{
  padding:24px; border-radius:24px; color:#fff;
  background:linear-gradient(135deg, #1A1A3E, #0D2137);
  border:1px solid rgba(255,255,255,.06);
  box-shadow:0 10px 30px rgba(var(--primary-rgb),.10);
}
[data-theme="dark"] .hero-card{ background:linear-gradient(135deg, #1A1A3E, #0D2137); }
:root .hero-card{ background:linear-gradient(135deg, #16213E, #0F172A); }
.hero-stat-row{display:flex; align-items:center;}
.hero-stat{flex:1; padding:0 10px;}
.hero-stat:first-child{padding-left:0;}
.hero-divider{width:1px; height:34px; background:rgba(255,255,255,.14);}
.hero-stat-label{display:flex; align-items:center; gap:4px; font-size:10.5px; color:rgba(255,255,255,.55); font-family:var(--font-body);}
.hero-stat-value{font-family:var(--font-mono); font-weight:700; font-size:13.5px; color:#fff; margin-top:2px;}

.quick-stat-tile{padding:14px; border-radius:16px; border:1px solid; background-clip:padding-box;}
.quick-actions-row{display:flex; gap:10px;}
.quick-action{flex:1; padding:14px 8px; border-radius:16px; text-align:center; cursor:pointer; border:1px solid; transition:.15s;}
.quick-action:hover{filter:brightness(1.08);}
.quick-action svg{width:20px;height:20px; margin-bottom:6px;}
.quick-action .qa-label{font-family:var(--font-body); font-size:10.5px; font-weight:700; line-height:1.2;}

.section-head{display:flex; align-items:center; justify-content:space-between; margin:22px 0 12px;}
.section-head h4{font-family:var(--font-head); font-weight:700; font-size:16px;}
.see-all{font-family:var(--font-body); font-size:12.5px; font-weight:700; color:var(--primary); cursor:pointer;}

.gradient-wallet-card{
  padding:20px; border-radius:20px; color:#fff; margin-bottom:12px; cursor:pointer;
  box-shadow:0 10px 24px rgba(0,0,0,.18);
}
.gw-icon{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.gw-icon svg{width:17px;height:17px;color:#fff;}
.gw-type{font-size:10px; color:rgba(255,255,255,.65); letter-spacing:.06em; text-transform:uppercase; font-family:var(--font-body);}
.gw-balance{font-family:var(--font-head); font-weight:800; font-size:25px; color:#fff; letter-spacing:-.02em; margin-top:14px;}
.gw-ministat{display:flex; align-items:center; gap:4px; font-size:11px; color:rgba(255,255,255,.75); font-family:var(--font-body);}

.settings-tile{display:flex; align-items:center; gap:14px; padding:13px 4px; border-bottom:1px solid var(--border); cursor:pointer;}
.settings-tile:last-child{border-bottom:none;}
.settings-tile-icon{width:38px;height:38px;border-radius:12px;background:rgba(var(--primary-rgb),.10); color:var(--primary); display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.settings-tile-icon svg{width:18px;height:18px;}
.settings-tile-title{font-weight:700; font-size:13.5px;}
.settings-tile-sub{font-size:11.5px; color:var(--text-2); margin-top:1px;}
.settings-section-label{font-family:var(--font-head); font-weight:700; font-size:12px; color:var(--text-2); text-transform:uppercase; letter-spacing:.05em; margin:20px 0 6px;}

@media print{
  .sidebar,.bottom-nav,.fab,.topbar,.no-print{display:none !important;}
  .main{width:100%;}
  .content{padding:0;}
  body{background:#fff;color:#000;}
  .card{box-shadow:none;border:1px solid #ccc;}
}
</style>

<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =====================================================================
   THE LEDGER — Frontend
   Single-file PWA. Vanilla JS, no framework/build step.
   Architecture: Workspace (Personal/Business/Family/…) -> Wallet (Cash/
   Bank/MoMo/…) -> Transactions/Budgets/Goals/Loans/Investments.
   State: local-first. Every mutation writes to localStorage immediately,
   then queues a background push to the Apps Script backend (debounced
   ~1.2s). Full pulls happen every 45s and on reconnect.
   ===================================================================== */

const ENTITIES = ['Wallets','Transactions','Categories','Budgets','Goals','Loans','LoanPayments','Preferences','Investments','ExchangeRates'];
const LS_KEY = 'ledger_state_v2';
const CURRENCIES = ['USD','GHS','EUR','GBP','NGN','ZAR','CAD','AUD','JPY','CNY','INR'];

const DEFAULT_STATE = {
  serverUrl: '', auth: null, theme: 'light', baseCurrency: 'GHS',
  showBalances: true, pinHash: '', pinEnabled: false,
  route: 'dashboard', txMonth: null, txAllTime: false,
  selectedWorkspaces: [], data: {}, syncQueue: [], lastPull: 0,
  lastRateAttempt: 0, lastRateError: ''
};
ENTITIES.concat(['Users','ActivityLog','Workspaces','UserWorkspaceAccess']).forEach(function(e){ DEFAULT_STATE.data[e] = []; });

let S = loadState();

function loadState(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    const parsed = JSON.parse(raw);
    const merged = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), parsed);
    merged.data = Object.assign({}, DEFAULT_STATE.data, parsed.data || {});
    return merged;
  } catch(e){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); }

function toast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast';
  if(kind==='error') el.style.background = 'var(--danger)';
  if(kind==='success') el.style.color = '#fff', el.style.background = 'var(--success)';
  el.textContent = msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(function(){ el.remove(); }, 3400);
}

function uid(){ return 'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtMoney(n, cur){
  n = Number(n)||0;
  const sign = n<0 ? '-' : '';
  return sign + (cur||S.baseCurrency||'') + ' ' + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtDate(d){ if(!d) return ''; const dt = new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function monthKey(d){ const dt = new Date(d); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ---------------------------------------------------------------------
   WORKSPACES / WALLETS — lookups used everywhere
   --------------------------------------------------------------------- */
function accessibleWorkspaces(){ return S.data.Workspaces || []; }
function ensureSelectedWorkspaces(){
  const ids = accessibleWorkspaces().map(function(w){return w.id;});
  S.selectedWorkspaces = S.selectedWorkspaces.filter(function(id){ return ids.indexOf(id)>-1; });
  if (!S.selectedWorkspaces.length && ids.length) S.selectedWorkspaces = ids.slice();
}
// Call before creating a record in a specific workspace so it doesn't seem to
// "vanish" if that workspace happens to be switched off in the workspace switcher.
function ensureWorkspaceInView(wsId){
  if (wsId && S.selectedWorkspaces.indexOf(wsId) === -1) S.selectedWorkspaces.push(wsId);
}
function walletsInSelected(){ return S.data.Wallets.filter(function(w){ return S.selectedWorkspaces.indexOf(w.workspaceId)>-1; }); }
function walletsInWorkspace(wsId){ return S.data.Wallets.filter(function(w){ return w.workspaceId===wsId; }); }
function workspaceOf(id, entity){
  if (entity==='wallet') { const w = S.data.Wallets.find(function(x){return x.id===id;}); return w?w.workspaceId:null; }
  return id;
}
function wsName(id){ const w = accessibleWorkspaces().find(function(x){return x.id===id;}); return w?w.name:'—'; }
function walletName(id){ const w = S.data.Wallets.find(function(x){return x.id===id;}); return w?w.name:'—'; }

/* ---------------------------------------------------------------------
   API + SYNC
   --------------------------------------------------------------------- */

function serverAuth(){ return { email: S.auth ? S.auth.email : '', code: S.auth ? S.auth.code : '' }; }

function callServer(action, payload){
  if (!S.serverUrl) return Promise.reject(new Error('No server configured'));
  const body = Object.assign({ action: action, auth: serverAuth() }, payload || {});
  return fetch(S.serverUrl, { method:'POST', body: JSON.stringify(body) })
    .then(function(r){ return r.json(); });
}

let syncTimer = null;
function queueSync(op){
  S.syncQueue.push(op);
  saveState();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushQueue, 1200);
  updateSyncBadge();
}

function pushQueue(){
  if (!navigator.onLine || !S.serverUrl || !S.auth) return;
  if (!S.syncQueue.length) return;
  const op = S.syncQueue[0];
  let promise;
  if (op.kind === 'create') promise = callServer('create', { entity: op.entity, data: op.data });
  else if (op.kind === 'update') promise = callServer('update', { entity: op.entity, id: op.id, data: op.data });
  else if (op.kind === 'delete') promise = callServer('delete', { entity: op.entity, id: op.id });
  else if (op.kind === 'transfer') promise = callServer('createTransfer', { data: op.data });
  else if (op.kind === 'deleteTransfer') promise = callServer('deleteTransfer', { transferId: op.transferId });
  else if (op.kind === 'createWorkspace') promise = callServer('createWorkspace', { data: op.data });
  else if (op.kind === 'updateWorkspace') promise = callServer('updateWorkspace', { id: op.id, data: op.data });
  else if (op.kind === 'deleteWorkspace') promise = callServer('deleteWorkspace', { id: op.id });
  else promise = Promise.resolve({ok:true});

  promise.then(function(res){
    if (!res || res.ok === false) { console.warn('sync failed', res); if (res && res.error) toast(res.error, 'error'); }
    S.syncQueue.shift(); saveState(); updateSyncBadge();
    if (S.syncQueue.length) pushQueue(); else setTimeout(pullAll, 400);
  }).catch(function(err){
    console.warn('sync network error, will retry', err);
    setTimeout(pushQueue, 5000);
  });
}

function pullAll(){
  if (!navigator.onLine || !S.serverUrl || !S.auth) return Promise.resolve();
  return callServer('listAll', {}).then(function(res){
    if (!res || res.ok === false) return;
    ENTITIES.concat(['Users','Workspaces']).forEach(function(e){ if (res[e]) S.data[e] = res[e]; });
    if (res.activityLog) S.data.ActivityLog = res.activityLog;
    if (res.userWorkspaceAccess) S.data.UserWorkspaceAccess = res.userWorkspaceAccess;
    ensureSelectedWorkspaces();
    S.lastPull = Date.now();
    saveState();
    render();
    autoFetchRatesIfNeeded();
  }).catch(function(err){ console.warn('pull failed', err); });
}

// Exchange rates are fetched automatically — no manual button needed. A wallet
// in a foreign currency would otherwise silently be treated at a 1:1 rate
// (e.g. 1 USD read as 1 GHS) until someone remembered to press "fetch rates".
function autoFetchRatesIfNeeded(){
  if (!S.serverUrl || !S.auth || !navigator.onLine) return;
  const rates = S.data.ExchangeRates || [];
  const freshForBase = rates.filter(function(r){ return r.fromCurrency === S.baseCurrency; });
  const newestUpdate = freshForBase.reduce(function(max,r){ const t = new Date(r.updatedAt).getTime(); return t>max?t:max; }, 0);
  const staleMs = 12*60*60*1000; // refresh at most twice a day on success
  const isStale = !freshForBase.length || (Date.now()-newestUpdate) > staleMs;
  if (!isStale) return;
  // Back off after a failure so a persistent problem (offline, provider down,
  // API throttling) doesn't get hammered every ~45s — that would make things
  // worse, not better. Retry failures at most once every 10 minutes.
  if (S.lastRateAttempt && (Date.now()-S.lastRateAttempt) < 10*60*1000) return;
  S.lastRateAttempt = Date.now();
  callServer('fetchRates', { base: S.baseCurrency, targets: CURRENCIES.filter(function(c){ return c!==S.baseCurrency; }) })
    .then(function(res){
      if (res && res.ok) { S.lastRateError = ''; saveState(); pullAll(); }
      else { S.lastRateError = (res && res.error) ? res.error : 'Unknown error from server'; saveState(); }
    })
    .catch(function(err){ S.lastRateError = 'Network error: ' + err; saveState(); });
}

function updateSyncBadge(){
  const b = document.getElementById('syncBadge');
  if (!b) return;
  if (!navigator.onLine) { b.textContent = 'Offline'; b.className='pill pill-warning'; }
  else if (S.syncQueue.length) { b.textContent = 'Syncing…'; b.className='pill pill-neutral'; }
  else { b.textContent = 'Synced'; b.className='pill pill-success'; }
}

window.addEventListener('online', function(){ pushQueue(); pullAll(); updateSyncBadge(); });
window.addEventListener('offline', updateSyncBadge);

function localCreate(entity, data){
  data.id = data.id || uid();
  if (entity === 'Transactions') { data.createdAt = new Date().toISOString(); data.createdBy = S.auth.email; }
  S.data[entity].push(data);
  saveState(); render();
  queueSync({ kind:'create', entity: entity, data: data });
  return data;
}
function localUpdate(entity, id, patch){
  const arr = S.data[entity];
  const idx = arr.findIndex(function(r){ return r.id === id; });
  if (idx === -1) return;
  arr[idx] = Object.assign({}, arr[idx], patch);
  saveState(); render();
  queueSync({ kind:'update', entity: entity, id: id, data: patch });
}
function localDelete(entity, id){
  const arr = S.data[entity];
  const rec = arr.find(function(r){ return r.id === id; });
  if (entity === 'Transactions' && rec && rec.transferId) {
    S.data.Transactions = S.data.Transactions.filter(function(t){ return t.transferId !== rec.transferId; });
    saveState(); render();
    queueSync({ kind:'deleteTransfer', transferId: rec.transferId });
    return;
  }
  S.data[entity] = arr.filter(function(r){ return r.id !== id; });
  saveState(); render();
  queueSync({ kind:'delete', entity: entity, id: id });
}
function localTransfer(data){
  const fromW = S.data.Wallets.find(function(w){return w.id===data.fromWallet;});
  const toW = S.data.Wallets.find(function(w){return w.id===data.toWallet;});
  const transferId = uid();
  const now = new Date().toISOString();
  const legOut = { id: uid(), workspaceId: fromW.workspaceId, wallet:data.fromWallet, type:'Transfer', category:'Transfer',
    amount: -Math.abs(data.amount), currency: fromW.currency, date: data.date,
    description:data.description||('Transfer to '+toW.name),
    tags:'', recurring:'', nextDueDate:'', receiptUrl:'', transferId:transferId, transferPeer:data.toWallet, createdBy:S.auth.email, createdAt:now };
  const legIn = { id: uid(), workspaceId: toW.workspaceId, wallet:data.toWallet, type:'Transfer', category:'Transfer',
    amount: Math.abs(data.amount), currency: toW.currency, date: data.date,
    description:data.description||('Transfer from '+fromW.name),
    tags:'', recurring:'', nextDueDate:'', receiptUrl:'', transferId:transferId, transferPeer:data.fromWallet, createdBy:S.auth.email, createdAt:now };
  S.data.Transactions.push(legOut, legIn);
  saveState(); render();
  queueSync({ kind:'transfer', data: data });
}
function localCreateWorkspace(data){
  data.id = uid(); data.createdAt = new Date().toISOString();
  S.data.Workspaces.push(data);
  S.selectedWorkspaces.push(data.id);
  saveState(); render();
  queueSync({ kind:'createWorkspace', data: data });
}
function localUpdateWorkspace(id, patch){
  const idx = S.data.Workspaces.findIndex(function(w){return w.id===id;});
  if (idx>-1) S.data.Workspaces[idx] = Object.assign({}, S.data.Workspaces[idx], patch);
  saveState(); render();
  queueSync({ kind:'updateWorkspace', id:id, data:patch });
}
function localDeleteWorkspace(id){
  S.data.Workspaces = S.data.Workspaces.filter(function(w){return w.id!==id;});
  S.selectedWorkspaces = S.selectedWorkspaces.filter(function(x){return x!==id;});
  saveState(); render();
  queueSync({ kind:'deleteWorkspace', id:id });
}

/* ---------------------------------------------------------------------
   RECURRING GENERATION (client-side check on open)
   --------------------------------------------------------------------- */
function processRecurringLocally(){
  const today = new Date(); today.setHours(0,0,0,0);
  let changed = false;
  S.data.Transactions.filter(function(t){ return t.recurring && t.nextDueDate; }).forEach(function(t){
    let due = new Date(t.nextDueDate);
    let guard = 0;
    while (due <= today && guard < 24) {
      const copy = { id: uid(), workspaceId:t.workspaceId, date: due.toISOString().slice(0,10), type:t.type, wallet:t.wallet, category:t.category,
        amount:t.amount, currency:t.currency, description:t.description, tags:t.tags, recurring:'', nextDueDate:'',
        receiptUrl:'', transferId:'', transferPeer:'', createdBy:'recurring:'+t.id, createdAt:new Date().toISOString() };
      S.data.Transactions.push(copy);
      changed = true;
      if (t.recurring==='Weekly') due.setDate(due.getDate()+7);
      else if (t.recurring==='Yearly') due.setFullYear(due.getFullYear()+1);
      else due.setMonth(due.getMonth()+1);
      guard++;
    }
    t.nextDueDate = due.toISOString().slice(0,10);
  });
  if (changed) { saveState(); if (S.auth && S.serverUrl) callServer('processRecurring',{}).catch(function(){}); }
}

/* ---------------------------------------------------------------------
   DERIVED / CALCULATIONS — all scoped to S.selectedWorkspaces
   --------------------------------------------------------------------- */

function rateFor(cur){
  if (!cur || cur === S.baseCurrency) return 1;
  const r = S.data.ExchangeRates.find(function(x){ return x.fromCurrency===S.baseCurrency && x.toCurrency===cur; });
  if (r && Number(r.rate)) return Number(r.rate);
  const inv = S.data.ExchangeRates.find(function(x){ return x.fromCurrency===cur && x.toCurrency===S.baseCurrency; });
  if (inv && Number(inv.rate)) return 1/Number(inv.rate);
  return 1;
}
function toBase(amount, cur){ return Number(amount||0) / rateFor(cur); }

function walletBalance(walletId){
  const w = S.data.Wallets.find(function(a){ return a.id===walletId; });
  if (!w) return 0;
  let bal = Number(w.openingBalance||0);
  S.data.Transactions.filter(function(t){ return t.wallet===walletId; }).forEach(function(t){
    bal += (t.type==='Expense' ? -Math.abs(Number(t.amount)) : Number(t.amount));
  });
  return bal;
}
function walletBalanceBase(walletId){
  const w = S.data.Wallets.find(function(a){ return a.id===walletId; });
  return toBase(walletBalance(walletId), w?w.currency:S.baseCurrency);
}
function walletMonthlyFlow(walletId){
  const mk = monthKey(new Date());
  let income = 0, expense = 0;
  S.data.Transactions.filter(function(t){ return t.wallet===walletId && t.type!=='Transfer' && monthKey(t.date)===mk; }).forEach(function(t){
    if (t.type==='Income') income += Math.abs(Number(t.amount)); else expense += Math.abs(Number(t.amount));
  });
  return { income: income, expense: expense };
}
function inScope(workspaceId){ return S.selectedWorkspaces.indexOf(workspaceId) > -1; }

function netWorth(){
  let cash = 0;
  walletsInSelected().forEach(function(w){ if (w.type!=='Debt') cash += walletBalanceBase(w.id); });
  let invest = 0;
  S.data.Investments.filter(function(i){ return inScope(i.workspaceId); }).forEach(function(i){
    const w = S.data.Wallets.find(function(a){return a.id===i.wallet;});
    invest += toBase(i.currentValue, w?w.currency:S.baseCurrency);
  });
  let loansOut = 0, loansOwed = 0;
  S.data.Loans.filter(function(l){ return inScope(l.workspaceId); }).forEach(function(l){
    const outstanding = loanOutstanding(l.id);
    if (l.direction==='Lent') loansOut += toBase(outstanding, l.currency);
    else loansOwed += toBase(outstanding, l.currency);
  });
  return { total: cash + invest + loansOut - loansOwed, cash: cash, invest: invest, loansOut: loansOut, loansOwed: loansOwed };
}
function txInScope(t){ return inScope(t.workspaceId); }
function cashFlowThisMonth(){
  const mk = monthKey(new Date());
  let income=0, expense=0;
  S.data.Transactions.filter(function(t){ return t.type!=='Transfer' && monthKey(t.date)===mk && txInScope(t); }).forEach(function(t){
    const amt = toBase(Math.abs(Number(t.amount)), t.currency);
    if (t.type==='Income') income += amt; else expense += amt;
  });
  return { income:income, expense:expense, net:income-expense };
}
function monthlySeries(months){
  const out = [];
  const now = new Date();
  for (let i=months-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const mk = monthKey(d);
    let income=0, expense=0;
    S.data.Transactions.filter(function(t){ return t.type!=='Transfer' && monthKey(t.date)===mk && txInScope(t); }).forEach(function(t){
      const amt = toBase(Math.abs(Number(t.amount)), t.currency);
      if (t.type==='Income') income+=amt; else expense+=amt;
    });
    out.push({ label: d.toLocaleDateString(undefined,{month:'short'}), income:income, expense:expense });
  }
  return out;
}
function budgetSpent(b){
  const mk = monthKey(new Date());
  let spent = 0;
  S.data.Transactions.filter(function(t){
    return t.type==='Expense' && monthKey(t.date)===mk && t.workspaceId===b.workspaceId &&
      (!b.category || t.category===b.category) && (!b.wallet || t.wallet===b.wallet);
  }).forEach(function(t){ spent += toBase(Math.abs(Number(t.amount)), t.currency); });
  return spent;
}
function loanOutstanding(loanId){
  const loan = S.data.Loans.find(function(l){ return l.id===loanId; });
  if (!loan) return 0;
  const paid = S.data.LoanPayments.filter(function(p){ return p.loanId===loanId; }).reduce(function(s,p){ return s+Number(p.amount||0); },0);
  return Math.max(0, Number(loan.principal||0) - paid);
}
function investmentSummary(){
  let cost=0, value=0;
  S.data.Investments.filter(function(i){ return inScope(i.workspaceId); }).forEach(function(i){
    const w = S.data.Wallets.find(function(a){return a.id===i.wallet;});
    cost += toBase(i.amountInvested, w?w.currency:S.baseCurrency);
    value += toBase(i.currentValue, w?w.currency:S.baseCurrency);
  });
  return { cost:cost, value:value, gain:value-cost };
}

function generateInsights(){
  const out = [];
  const series = monthlySeries(2);
  if (series.length===2 && series[0].expense>0){
    const pct = ((series[1].expense-series[0].expense)/series[0].expense)*100;
    if (Math.abs(pct) >= 8) out.push({ level: pct>0?'warning':'success', text: 'Spending is ' + (pct>0?'up ':'down ') + Math.abs(pct).toFixed(0) + '% vs last month.' });
  }
  S.data.Budgets.filter(function(b){return inScope(b.workspaceId);}).forEach(function(b){
    const spent = budgetSpent(b);
    const pct = b.monthlyLimit ? (spent/Number(b.monthlyLimit))*100 : 0;
    if (pct >= 100) out.push({ level:'danger', text: (b.category||'Budget') + ' is over budget this month (' + wsName(b.workspaceId) + ').' });
    else if (pct >= 85) out.push({ level:'warning', text: (b.category||'Budget') + ' is at ' + pct.toFixed(0) + '% of its monthly limit (' + wsName(b.workspaceId) + ').' });
  });
  S.data.Goals.filter(function(g){return inScope(g.workspaceId);}).forEach(function(g){
    if (!g.deadline) return;
    const days = Math.ceil((new Date(g.deadline)-new Date())/86400000);
    if (days>=0 && days<=30) out.push({ level:'warning', text: '"'+g.name+'" deadline is in ' + days + ' day(s).' });
  });
  S.data.Loans.filter(function(l){return inScope(l.workspaceId);}).forEach(function(l){
    if (!l.dueDate || l.status==='Closed') return;
    const days = Math.ceil((new Date(l.dueDate)-new Date())/86400000);
    if (days>=0 && days<=14) out.push({ level:'warning', text: (l.direction==='Lent'?'Loan to ':'Loan from ') + l.counterparty + ' due in ' + days + ' day(s).' });
  });
  const todayTx = S.data.Transactions.some(function(t){ return t.date===todayISO() && txInScope(t); });
  if (!todayTx) out.push({ level:'neutral', text: 'No transaction logged yet today.' });
  const cats = {};
  S.data.Categories.filter(function(c){return c.type==='Expense' && inScope(c.workspaceId);}).forEach(function(c){ cats[c.name+'|'+c.workspaceId]=[]; });
  for (let i=2;i>=0;i--){
    const d = new Date(); d.setMonth(d.getMonth()-i);
    const mk = monthKey(d);
    Object.keys(cats).forEach(function(key){
      const cat = key.split('|')[0], wsId = key.split('|')[1];
      const sum = S.data.Transactions.filter(function(t){ return t.type==='Expense' && t.category===cat && t.workspaceId===wsId && monthKey(t.date)===mk; })
        .reduce(function(s,t){ return s+toBase(Math.abs(t.amount),t.currency); },0);
      cats[key].push(sum);
    });
  }
  Object.keys(cats).forEach(function(key){
    const v = cats[key];
    if (v[0]>0 && v[1]>v[0] && v[2]>v[1]) out.push({ level:'warning', text: key.split('|')[0] + ' spending has risen for 3 straight months.' });
  });
  return out;
}

function doBootstrap(){
  const url = document.getElementById('loginUrl').value.trim();
  const name = document.getElementById('loginName').value.trim();
  const email = document.getElementById('loginEmail').value.trim();
  const code = document.getElementById('loginCode').value.trim();
  if (!url || !name || !email || !code) return toast('Fill in every field', 'error');
  const btn = document.getElementById('loginBtn'); btn.disabled = true; btn.textContent = 'Creating…';
  fetch(url, { method:'POST', body: JSON.stringify({ action:'bootstrap', name:name, email:email, code:code }) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res.ok) { toast(res.error||'Could not bootstrap', 'error'); btn.disabled=false; btn.textContent='Create Owner account'; return; }
      S.serverUrl = url; S.auth = { email: res.user.email, code: res.accessCode, role: res.user.role, name: res.user.name };
      saveState();
      pullAll().then(function(){ render(); showAccessCodeModal(res.accessCode, res.user.email); });
    })
    .catch(function(err){ toast('Network error: '+err, 'error'); btn.disabled=false; btn.textContent='Create Owner account'; });
}

function doLogin(){
  const url = document.getElementById('loginUrl').value.trim();
  const email = document.getElementById('loginEmail').value.trim();
  const code = document.getElementById('loginCode').value.trim();
  if (!url || !email || !code) return toast('Fill in every field', 'error');
  const btn = document.getElementById('loginBtn'); btn.disabled = true; btn.textContent = 'Logging in…';
  fetch(url, { method:'POST', body: JSON.stringify({ action:'login', email:email, code:code }) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res.ok) { toast(res.error||'Login failed', 'error'); btn.disabled=false; btn.textContent='Log in'; return; }
      S.serverUrl = url; S.auth = { email: res.user.email, code: code, role: res.user.role, name: res.user.name };
      saveState();
      pullAll().then(render);
    })
    .catch(function(err){ toast('Network error: '+err, 'error'); btn.disabled=false; btn.textContent='Log in'; });
}

function levelColor(l){ return l==='danger'?'var(--danger)':l==='warning'?'var(--warning)':l==='success'?'var(--success)':'var(--text-2)'; }
function accentFor(type){
  const map = { Cash:'#43E97B', Bank:'#4FACFE', 'Mobile Money':'#FECE2F', Card:'#A18CD1', Crypto:'#667EEA', Savings:'#38F9D7', Investment:'#F093FB', Debt:'var(--danger)', Other:'var(--text-2)' };
  return map[type] || 'var(--primary)';
}
const CATEGORY_PALETTE = ['#FF6B6B','#4ECDC4','#FFE66D','#95E1D3','#A29BFE','#6C5CE7','#00CEC9','#74B9FF','#00D4AA','#55EFC4','#FD79A8','#FAB1A0'];
function categoryColor(name){
  let hash = 0;
  for (let i=0;i<(name||'').length;i++) hash = (hash*31 + name.charCodeAt(i)) >>> 0;
  return CATEGORY_PALETTE[hash % CATEGORY_PALETTE.length];
}
function categoryIcon(name){
  const n = (name||'').toLowerCase();
  if (n.indexOf('food')>-1||n.indexOf('dining')>-1) return 'utensils';
  if (n.indexOf('transport')>-1) return 'car';
  if (n.indexOf('hous')>-1) return 'home';
  if (n.indexOf('util')>-1) return 'zap';
  if (n.indexOf('health')>-1) return 'heart-pulse';
  if (n.indexOf('shop')>-1) return 'shopping-bag';
  if (n.indexOf('entertain')>-1) return 'popcorn';
  if (n.indexOf('educ')>-1) return 'graduation-cap';
  if (n.indexOf('business')>-1) return 'briefcase';
  if (n.indexOf('saving')>-1||n.indexOf('invest')>-1) return 'piggy-bank';
  if (n.indexOf('debt')>-1) return 'credit-card';
  if (n.indexOf('salary')>-1||n.indexOf('income')>-1) return 'wallet';
  if (n.indexOf('gift')>-1) return 'gift';
  return 'circle-dot';
}
function tintedIcon(icon, color, size){
  size = size || 38;
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:'+(size*0.32)+'px;background:color-mix(in srgb, '+color+' 20%, transparent);color:'+color+';display:flex;align-items:center;justify-content:center;flex-shrink:0;">'+iconSvg(icon)+'</div>';
}
function txRow(t){

    '<div style="display:flex;align-items:center;gap:12px;min-width:0;">' +

      '<div style="min-width:0;"><div style="font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(t.description||t.category)+'</div>' +

  if (!S.txAllTime) list = list.filter(function(t){ return monthKey(t.date)===S.txMonth; });

  if (f.search) list = list.filter(function(t){ return (t.description+' '+t.category).toLowerCase().indexOf(f.search.toLowerCase())>-1; });
  if (f.wallet) list = list.filter(function(t){ return t.wallet===f.wallet; });
  if (f.type) list = list.filter(function(t){ return t.type===f.type; });

  const [y,m] = S.txMonth.split('-').map(Number);
  const monthLabel = new Date(y, m-1, 1).toLocaleDateString(undefined,{month:'long', year:'numeric'});
  const multiWs = S.selectedWorkspaces.length > 1;

  const rows = list.map(function(t){
    const w = S.data.Wallets.find(function(a){return a.id===t.wallet;});

    const checked = window.__txSelected[t.id] ? 'checked' : '';

      '<td data-label="Date">'+fmtDate(t.date)+'</td>' +
      '<td data-label="Type"><span class="pill '+(t.type==='Income'?'pill-success':t.type==='Transfer'?'pill-neutral':'pill-danger')+'">'+t.type+'</span></td>' +
      '<td data-label="Description">'+escapeHtml(t.description||'—')+(t.recurring?' <span class="pill pill-neutral">'+t.recurring+'</span>':'')+(t.receiptUrl?' <a href="'+t.receiptUrl+'" target="_blank" onclick="event.stopPropagation()" style="color:var(--primary);">'+iconSvg('paperclip')+'</a>':'')+'</td>' +
      '<td data-label="Category">'+escapeHtml(t.category)+'</td>' +
      '<td data-label="Wallet">'+escapeHtml(w?w.name:'—')+(multiWs?' <span class="muted" style="font-size:11px;">· '+wsName(t.workspaceId)+'</span>':'')+'</td>' +
      '<td data-label="Amount" class="mono '+(S.showBalances?'':'blur-balance')+'" style="color:'+amtColor+';font-weight:700;">'+fmtMoney(t.amount, t.currency)+'</td>' +
      '<td data-label=""><div class="icon-btn" style="width:30px;height:30px;" onclick="openTxModal(\''+t.id+'\')">'+iconSvg('pencil')+'</div></td>' +
    '</tr>';

  return '' +
  '<div class="card" style="margin-bottom:16px;">' +
    '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;">' +
      '<div style="display:flex;align-items:center;gap:8px;">' +
        (S.txAllTime ? '<span style="font-weight:700;">All time</span>' :
        '<div class="icon-btn" onclick="shiftMonth(-1)">'+iconSvg('chevron-left')+'</div>' +
        '<span style="font-weight:700;min-width:150px;text-align:center;">'+monthLabel+'</span>' +
        '<div class="icon-btn" onclick="shiftMonth(1)">'+iconSvg('chevron-right')+'</div>') +
        '<span class="btn btn-ghost btn-sm" onclick="S.txAllTime=!S.txAllTime;saveState();render();" style="margin-left:8px;">'+(S.txAllTime?'Show by month':'Show all time')+'</span>' +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
        '<span class="btn btn-outline btn-sm" onclick="exportTxCsv()">'+iconSvg('download')+' CSV</span>' +
        (canEdit() ? '<span class="btn btn-outline btn-sm" onclick="openTxModal(null,\'Transfer\')">'+iconSvg('arrow-left-right')+' Transfer</span>' : '') +
        (canEdit() ? '<span class="btn btn-primary btn-sm" onclick="openTxModal()">'+iconSvg('plus')+' Add</span>' : '') +
      '</div>' +
    '</div>' +
    '<div class="field-row" style="margin-top:14px;">' +
      '<div class="field" style="margin-bottom:0;"><input placeholder="Search description or category…" value="'+escapeHtml(f.search)+'" oninput="window.__txFilters.search=this.value;render();"></div>' +
      '<div class="field" style="margin-bottom:0;max-width:160px;"><select onchange="window.__txFilters.type=this.value;render();"><option value="">All types</option>' +
        ['Income','Expense','Transfer'].map(function(t){return '<option '+(f.type===t?'selected':'')+'>'+t+'</option>';}).join('') + '</select></div>' +
      '<div class="field" style="margin-bottom:0;max-width:220px;"><select onchange="window.__txFilters.wallet=this.value;render();"><option value="">All wallets</option>' + walletOptionsGrouped(f.wallet) + '</select></div>' +
    '</div>' +
    (Object.values(window.__txSelected).some(Boolean) ? '<div style="margin-top:10px;"><span class="btn btn-danger btn-sm" onclick="bulkDeleteTx()">'+iconSvg('trash-2')+' Delete selected</span></div>' : '') +
  '</div>' +

    (list.length ?
    '<table class="responsive-table"><thead><tr><th></th><th>Date</th><th>Type</th><th>Description</th><th>Category</th><th>Wallet</th><th>Amount</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>' :
    '<div class="empty">'+iconSvg('inbox')+'<div>No transactions match. Try a different month, workspace, or filter.</div></div>') +

}

function shiftMonth(delta){
  const [y,m] = S.txMonth.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  S.txMonth = monthKey(d); saveState(); render();
}

function exportTxCsv(){
  const headers = ['date','type','wallet','workspace','category','amount','currency','description','tags'];
  const rows = S.data.Transactions.filter(txInScope).map(function(t){
    const vals = { date:t.date, type:t.type, wallet:walletName(t.wallet), workspace:wsName(t.workspaceId), category:t.category, amount:t.amount, currency:t.currency, description:t.description, tags:t.tags };
    return headers.map(function(h){ return '"'+String(vals[h]==null?'':vals[h]).replace(/"/g,'""')+'"'; }).join(',');
  });
  const csv = headers.join(',') + '\n' + rows.join('\n');
  downloadFile('ledger-transactions.csv', csv, 'text/csv');
}
function downloadFile(name, content, mime){
  const blob = new Blob([content], {type:mime});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

function bulkDeleteTx(){
  const ids = Object.keys(window.__txSelected).filter(function(id){ return window.__txSelected[id]; });
  if (!ids.length) return;
  if (!confirm('Delete ' + ids.length + ' transaction(s)? This cannot be undone.')) return;
  ids.forEach(function(id){ localDelete('Transactions', id); });
  window.__txSelected = {};
}

    const from = document.getElementById('qaFrom').value, to = document.getElementById('qaTo').value;
    if (from===to) return toast('Pick two different wallets', 'error');
    const fromW = S.data.Wallets.find(function(w){return w.id===from;});
    const toW = S.data.Wallets.find(function(w){return w.id===to;});
    if (fromW) ensureWorkspaceInView(fromW.workspaceId);
    if (toW) ensureWorkspaceInView(toW.workspaceId);

    const defaultCat = S.data.Categories.find(function(c){ return c.type===window.__qaType && w && c.workspaceId===w.workspaceId; });

function categoryOptions(type, selected, wsId){
  return S.data.Categories.filter(function(c){ return c.type===type && (!wsId || c.workspaceId===wsId); })
    .map(function(c){ return '<option value="'+escapeHtml(c.name)+'" '+(selected===c.name?'selected':'')+'>'+escapeHtml(c.name)+'</option>'; }).join('');

function saveTxModal(id){
  const amountRaw = Math.abs(Number(document.getElementById('fAmount').value||0));
  if (!amountRaw) return toast('Enter an amount', 'error');
  const walletId = document.getElementById('fWallet').value;
  const w = S.data.Wallets.find(function(a){return a.id===walletId;});
  const data = {
    date: document.getElementById('fDate').value, type: window.__txModalType,
    wallet: walletId, workspaceId: w?w.workspaceId:'', category: document.getElementById('fCategory').value,
    amount: amountRaw, currency: w?w.currency:'', description: document.getElementById('fDesc').value,
    tags: document.getElementById('fTags').value, recurring: document.getElementById('fRecurring').value,
    nextDueDate: document.getElementById('fRecurring').value ? nextDueFromToday(document.getElementById('fRecurring').value, document.getElementById('fDate').value) : ''
  };
  const fileInput = document.getElementById('fReceipt');
  const finish = function(receiptUrl){
    if (receiptUrl) data.receiptUrl = receiptUrl;
    ensureWorkspaceInView(data.workspaceId);
    if (id) localUpdate('Transactions', id, data); else localCreate('Transactions', data);
    closeModal();
  };
  if (fileInput.files && fileInput.files[0]) {
    compressImageToBase64(fileInput.files[0]).then(function(b64){
      if (!S.serverUrl || !S.auth) { finish(); return; }
      callServer('uploadReceipt', { base64:b64, mimeType:'image/jpeg', filename:'receipt-'+Date.now()+'.jpg' })
        .then(function(res){ finish(res && res.ok ? res.url : ''); })
        .catch(function(){ toast('Receipt upload failed, saved without it', 'error'); finish(); });
    });
  } else finish();
}
function nextDueFromToday(freq, fromDate){
  const d = new Date(fromDate);
  if (freq==='Weekly') d.setDate(d.getDate()+7); else if (freq==='Yearly') d.setFullYear(d.getFullYear()+1); else d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}
function compressImageToBase64(file){
  return new Promise(function(resolve){
    const img = new Image();
    const reader = new FileReader();
    reader.onload = function(e){ img.onload = function(){
      const canvas = document.createElement('canvas');
      const scale = Math.min(1, 1200/Math.max(img.width,img.height));
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      resolve(canvas.toDataURL('image/jpeg',0.7).split(',')[1]);
    }; img.src = e.target.result; };
    reader.readAsDataURL(file);
  });
}

function openTransferModal(){
  const all = S.data.Wallets;
  if (all.length<2) return toast('You need at least 2 wallets to transfer between them', 'error');
  openModal('' +
    '<div class="modal-head"><h3>Transfer Between Wallets</h3><div class="icon-btn" onclick="closeModal()">'+iconSvg('x')+'</div></div>' +
    '<p class="muted" style="font-size:12.5px;">Works within one workspace or across two different ones.</p>' +
    '<div class="field"><label>Date</label><input type="date" id="trDate" value="'+todayISO()+'"></div>' +
    '<div class="field-row"><div class="field"><label>From</label><select id="trFrom">'+walletOptionsGrouped(all[0]?all[0].id:'')+'</select></div>' +
    '<div class="field"><label>To</label><select id="trTo">'+walletOptionsGrouped(all[1]?all[1].id:'')+'</select></div></div>' +
    '<div class="field"><label>Amount</label><input type="number" step="0.01" id="trAmount" placeholder="0.00"></div>' +
    '<div class="field"><label>Note</label><input id="trDesc" placeholder="optional"></div>' +
    '<span class="btn btn-primary btn-block" onclick="saveTransfer()">Transfer</span>'
  );
}
function saveTransfer(){
  const from = document.getElementById('trFrom').value, to = document.getElementById('trTo').value;
  const amount = Math.abs(Number(document.getElementById('trAmount').value||0));
  if (from===to) return toast('Pick two different wallets', 'error');
  if (!amount) return toast('Enter an amount', 'error');
  const fromW = S.data.Wallets.find(function(w){return w.id===from;});
  const toW = S.data.Wallets.find(function(w){return w.id===to;});
  if (fromW) ensureWorkspaceInView(fromW.workspaceId);
  if (toW) ensureWorkspaceInView(toW.workspaceId);
  localTransfer({ date: document.getElementById('trDate').value, fromWallet:from, toWallet:to, amount:amount, description: document.getElementById('trDesc').value });
  closeModal();
}
function openTransferInfoModal(t){
  const w = S.data.Wallets.find(function(a){return a.id===t.wallet;});
  openModal('' +
    '<div class="modal-head"><h3>Transfer</h3><div class="icon-btn" onclick="closeModal()">'+iconSvg('x')+'</div></div>' +
    '<p class="muted">Transfers are a linked pair of records and can\'t be edited directly — delete and recreate if something needs to change.</p>' +
    '<div class="card" style="background:var(--surface-2);"><div>Date: '+fmtDate(t.date)+'</div><div>Wallet: '+escapeHtml(w?w.name:'—')+' ('+wsName(t.workspaceId)+')</div><div>Amount: '+fmtMoney(Math.abs(t.amount), t.currency)+'</div><div>Note: '+escapeHtml(t.description||'—')+'</div></div>' +
    '<span class="btn btn-danger btn-block" style="margin-top:14px;" onclick="localDelete(\'Transactions\',\''+t.id+'\');closeModal();">Delete transfer</span>'
  );
}

function renderWallets(){
  const multiWs = S.selectedWorkspaces.length > 1;
  const wallets = walletsInSelected();
  let totalBase = 0; wallets.forEach(function(w){ totalBase += walletBalanceBase(w.id); });
  const balClass = S.showBalances ? '' : 'blur-balance';

  const summary = '' +
    '<div class="card" style="background:linear-gradient(135deg, rgba(var(--primary-rgb),.14), rgba(var(--primary-rgb),.04)); border-color:rgba(var(--primary-rgb),.2); margin-bottom:22px;">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;">' +
        '<div><div class="muted" style="font-size:12px;">Total across wallets</div>' +
        '<div class="mono '+balClass+'" style="font-family:var(--font-head);font-weight:800;font-size:26px;margin-top:4px;">'+fmtMoney(totalBase)+'</div></div>' +
        '<div style="width:52px;height:52px;border-radius:16px;background:rgba(var(--primary-rgb),.12);display:flex;align-items:center;justify-content:center;color:var(--primary);">'+iconSvg('wallet')+'</div>' +
      '</div>' +
    '</div>';

  const sections = accessibleWorkspaces().filter(function(ws){return inScope(ws.id);}).map(function(ws){
    const wsWallets = walletsInWorkspace(ws.id);
    const cards = wsWallets.map(function(w){
      const bal = walletBalance(w.id);
      const flow = walletMonthlyFlow(w.id);
      const differs = w.currency !== S.baseCurrency;
      const grad = gradientFor(w.type);
      return '<div class="gradient-wallet-card" style="background:linear-gradient(135deg,'+grad[0]+','+grad[1]+');" onclick="go(\'transactions\');window.__txWalletFilter=\''+w.id+'\';render();">' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
          '<div class="gw-icon">'+iconSvg(walletTypeIcon(w.type))+'</div>' +
          '<div style="flex:1;min-width:0;"><div style="font-family:var(--font-head);font-weight:700;font-size:15px;color:#fff;">'+escapeHtml(w.name)+'</div><div class="gw-type">'+escapeHtml(w.type)+'</div></div>' +
          (canEdit()?'<span class="icon-btn" style="width:28px;height:28px;background:rgba(255,255,255,.15);border-color:transparent;color:#fff;" onclick="event.stopPropagation();openWalletModal(\''+w.id+'\')">'+iconSvg('pencil')+'</span>':'') +
          iconSvg('chevron-right') +
        '</div>' +
        '<div class="gw-balance '+balClass+'">'+fmtMoney(differs ? toBase(bal,w.currency) : bal, S.baseCurrency)+'</div>' +
        (differs ? '<div class="gw-ministat '+balClass+'" style="margin-top:2px;">'+fmtMoney(bal, w.currency)+' actual</div>' : '') +
        '<div style="display:flex;gap:16px;margin-top:12px;">' +
          '<div class="gw-ministat '+balClass+'">'+iconSvg('arrow-down-left')+' Income '+fmtMoney(flow.income, w.currency)+'</div>' +
          '<div class="gw-ministat '+balClass+'">'+iconSvg('arrow-up-right')+' Spent '+fmtMoney(flow.expense, w.currency)+'</div>' +
        '</div>' +
      '</div>';
    }).join('');
    return '<div style="margin-bottom:8px;">' +
      (multiWs ? '<h4 style="margin-bottom:12px;display:flex;align-items:center;gap:8px;">'+iconSvg(ws.icon||'briefcase')+escapeHtml(ws.name)+'</h4>' : '') +
      (cards || '<div class="empty">'+iconSvg('wallet')+'<div>No wallets in this workspace yet.</div></div>') +
    '</div>';
  }).join('');

  return '' +

  summary +
  (sections || '<div class="empty">'+iconSvg('wallet')+'<div>No workspaces selected.</div></div>') +

function renderBudgets(){
  const list = S.data.Budgets.filter(function(b){return inScope(b.workspaceId);});
  const totalLimit = list.reduce(function(s,b){return s+Number(b.monthlyLimit||0);},0);
  const totalSpent = list.reduce(function(s,b){return s+budgetSpent(b);},0);
  const overallPct = totalLimit ? Math.min(100,(totalSpent/totalLimit)*100) : 0;

  const summary = list.length ? '' +
    '<div class="card" style="background:linear-gradient(135deg, rgba(var(--primary-rgb),.14), rgba(var(--primary-rgb),.04)); border-color:rgba(var(--primary-rgb),.2); margin-bottom:20px;">' +

      '<div style="display:flex;align-items:baseline;gap:8px;margin-top:4px;">' +
        '<span class="mono" style="font-family:var(--font-head);font-weight:800;font-size:24px;">'+fmtMoney(totalSpent)+'</span>' +

      '</div>' +
      '<div class="progress-track" style="margin-top:12px;"><div class="progress-fill" style="width:'+overallPct+'%;background:'+(overallPct>=100?'var(--danger)':overallPct>=85?'var(--warning)':'var(--primary)')+'"></div></div>' +
    '</div>' : '';

  const cards = list.map(function(b){
    const spent = budgetSpent(b); const pct = b.monthlyLimit? Math.min(100,(spent/Number(b.monthlyLimit))*100):0;
    const color = pct>=100?'var(--danger)':(pct>=85?'var(--warning)':categoryColor(b.category));
    return '<div class="card" style="margin-bottom:10px;">' +
      '<div style="display:flex;align-items:center;gap:12px;">' +
        tintedIcon(categoryIcon(b.category), color) +

      '</div>' +
      '<div class="progress-track" style="margin-top:12px;"><div class="progress-fill" style="width:'+pct+'%;background:'+color+'"></div></div>' +
      '<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;" class="mono"><span>'+fmtMoney(spent)+' spent</span><span class="muted">of '+fmtMoney(b.monthlyLimit)+'</span></div>' +
    '</div>';
  }).join('');
  return '<div style="display:flex;justify-content:flex-end;margin-bottom:14px;">' + (canEdit()?'<span class="btn btn-primary btn-sm" onclick="openBudgetModal()">'+iconSvg('plus')+' Add Budget</span>':'') + '</div>' +

function renderPreference(){
  window.__prefWorkspace = window.__prefWorkspace && inScope(window.__prefWorkspace) ? window.__prefWorkspace : S.selectedWorkspaces[0];
  const wsId = window.__prefWorkspace;
  const items = S.data.Preferences.filter(function(p){return p.workspaceId===wsId;}).sort(function(a,b){ return Number(a.rank)-Number(b.rank); });
  const budgetKey = 'ledger_pref_budget_'+wsId;
  const budgetInput = window.__prefBudget != null ? window.__prefBudget : (window.__prefBudget = Number(localStorage.getItem(budgetKey)||0));
  let running = 0, cutoffIndex = -1;
  items.forEach(function(it,idx){ running += Number(it.estimatedCost||0); if (cutoffIndex===-1 && running>budgetInput) cutoffIndex = idx; });
  const rows = items.map(function(it, idx){
    const funded = cutoffIndex===-1 || idx < cutoffIndex;

    (idx===cutoffIndex ? '<div style="border-top:2px dashed var(--danger);position:relative;margin:4px 0 10px;"><span style="position:absolute;top:-11px;left:10px;background:var(--bg);padding:0 8px;font-size:11px;color:var(--danger);font-weight:700;">BUDGET LINE — '+fmtMoney(budgetInput)+'</span></div>' : '') +

        '<div class="icon-btn" style="width:26px;height:26px;" onclick="movePref(\''+it.id+'\',1)">'+iconSvg('chevron-down')+'</div>' +
      '</div>' +
      '<div style="width:26px;text-align:center;font-weight:800;color:var(--text-2);">'+(idx+1)+'</div>' +
      '<div style="flex:1;"><div style="font-weight:700;">'+escapeHtml(it.item)+'</div><span class="pill '+(it.category==='Need'?'pill-success':'pill-warning')+'">'+it.category+'</span></div>' +

    '<div class="field" style="margin-bottom:0;min-width:200px;"><label>Workspace</label><select onchange="window.__prefWorkspace=this.value;window.__prefBudget=null;render();">'+workspaceSelectOptions(wsId)+'</select></div>' +

    (canEdit()?'<span class="btn btn-primary" onclick="openPrefModal()">'+iconSvg('plus')+' Add Item</span>':'') +
  '</div>' +
  (rows || '<div class="empty">'+iconSvg('list-ordered')+'<div>Add wants and needs, rank them, then set a budget to see what\'s funded.</div></div>');
}
function movePref(id, dir){
  const wsId = window.__prefWorkspace;
  const items = S.data.Preferences.filter(function(p){return p.workspaceId===wsId;}).sort(function(a,b){ return Number(a.rank)-Number(b.rank); });
  const idx = items.findIndex(function(i){return i.id===id;});
  const swapIdx = idx+dir;
  if (swapIdx<0 || swapIdx>=items.length) return;
  const a = items[idx], b = items[swapIdx];
  const rankA = a.rank, rankB = b.rank;
  localUpdate('Preferences', a.id, { rank: rankB });
  localUpdate('Preferences', b.id, { rank: rankA });
}

/* ---------------------------------------------------------------------
   INSIGHTS (rule-based only — explicitly not AI/ML)
   --------------------------------------------------------------------- */
function renderInsights(){
  const list = generateInsights();
  const series = monthlySeries(6);
  const maxV = Math.max(1, Math.max.apply(null, series.map(function(s){return Math.max(s.income,s.expense);})));
  const barsW = 700, barsH = 180, pad = 30, groupW = (barsW-pad*2)/series.length;
  let barsSvg = '<svg viewBox="0 0 '+barsW+' '+(barsH+30)+'" style="width:100%;height:auto;">';
  series.forEach(function(s,i){
    const x = pad + i*groupW;
    const ih = (s.income/maxV)*barsH, eh = (s.expense/maxV)*barsH;
    barsSvg += '<rect x="'+(x+4)+'" y="'+(barsH-ih)+'" width="'+(groupW*0.32)+'" height="'+ih+'" rx="4" fill="var(--success)"/>';
    barsSvg += '<rect x="'+(x+4+groupW*0.36)+'" y="'+(barsH-eh)+'" width="'+(groupW*0.32)+'" height="'+eh+'" rx="4" fill="var(--danger)"/>';
    barsSvg += '<text x="'+(x+groupW/2)+'" y="'+(barsH+20)+'" text-anchor="middle" font-size="11" fill="var(--text-2)" font-family="DM Sans">'+s.label+'</text>';
  });
  barsSvg += '</svg>';
  return '' +
  '<div class="card" style="margin-bottom:16px;">' +
    '<h4 style="margin-bottom:10px;">Income vs Expense — 6 months</h4>' + barsSvg +
    '<div style="display:flex;gap:16px;font-size:12px;color:var(--text-2);margin-top:4px;"><span><span class="badge-dot" style="background:var(--success)"></span> Income</span><span><span class="badge-dot" style="background:var(--danger)"></span> Expense</span></div>' +
  '</div>' +
  '<div class="card" style="margin-bottom:16px;background:var(--surface-2);border:none;"><div style="display:flex;gap:10px;align-items:center;">'+iconSvg('info')+
  '<span style="font-size:13px;">These insights are simple rule-based checks on your own data (month-over-month %, budget thresholds, upcoming dates), scoped to the workspace(s) you have selected. There is no AI or machine learning involved.</span></div></div>' +
  (list.length ? list.map(function(a){
    return '<div class="card" style="margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;border-left:3px solid '+levelColor(a.level)+';">' +
      iconSvg(a.level==='danger'?'alert-circle':a.level==='warning'?'alert-triangle':a.level==='success'?'check-circle':'circle') +
      '<span style="font-size:14px;">'+escapeHtml(a.text)+'</span></div>';
  }).join('') : '<div class="empty">'+iconSvg('sparkles')+'<div>All clear — nothing flagged right now.</div></div>');
}

/* ---------------------------------------------------------------------
   REPORTS
   --------------------------------------------------------------------- */
function renderReports(){
  const range = window.__reportRange || (window.__reportRange = { from: todayISO().slice(0,8)+'01', to: todayISO() });
  const list = S.data.Transactions.filter(function(t){ return t.date>=range.from && t.date<=range.to && txInScope(t); });
  let income=0, expense=0; const byCat = {};
  list.forEach(function(t){
    if (t.type==='Transfer') return;
    const amt = toBase(Math.abs(t.amount), t.currency);
    if (t.type==='Income') income+=amt; else { expense+=amt; byCat[t.category] = (byCat[t.category]||0)+amt; }
  });
  const catRows = Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];}).map(function(cat){
    return '<tr><td data-label="Category">'+escapeHtml(cat)+'</td><td data-label="Amount" class="mono">'+fmtMoney(byCat[cat])+'</td><td data-label="% of expense">'+(expense?((byCat[cat]/expense)*100).toFixed(1):'0')+'%</td></tr>';
  }).join('');
  const scopeLabel = S.selectedWorkspaces.length===accessibleWorkspaces().length ? 'All Workspaces' : S.selectedWorkspaces.map(wsName).join(', ');
  return '' +
  '<div class="card no-print" style="margin-bottom:16px;">' +
    '<div class="field-row" style="align-items:flex-end;">' +
      '<div class="field" style="margin-bottom:0;"><label>From</label><input type="date" value="'+range.from+'" onchange="window.__reportRange.from=this.value;render();"></div>' +
      '<div class="field" style="margin-bottom:0;"><label>To</label><input type="date" value="'+range.to+'" onchange="window.__reportRange.to=this.value;render();"></div>' +
      '<span class="btn btn-outline" onclick="window.print()">'+iconSvg('printer')+' Print / PDF</span>' +
      '<span class="btn btn-outline" onclick="exportTxCsv()">'+iconSvg('download')+' CSV</span>' +
    '</div>' +
  '</div>' +
  '<p class="muted" style="font-size:12.5px;margin:-6px 0 12px;">Scope: '+escapeHtml(scopeLabel)+' — change from the workspace switcher.</p>' +
  '<div class="grid grid-3" style="margin-bottom:16px;">' +
    statCard('Income', fmtMoney(income), range.from+' → '+range.to) +
    statCard('Expense', fmtMoney(expense), '') +
    statCard('Net', fmtMoney(income-expense), '') +
  '</div>' +
  '<div class="card"><h4 style="margin-bottom:12px;">Expense by Category</h4>' +
    (catRows ? '<table class="responsive-table"><thead><tr><th>Category</th><th>Amount</th><th>%</th></tr></thead><tbody>'+catRows+'</tbody></table>' : '<div class="empty">No expenses in this range.</div>') +
  '</div>';
}

function sendInvite(){
  const name = document.getElementById('fName').value.trim(), email = document.getElementById('fEmail').value.trim(), role = document.getElementById('fRole').value;
  const workspaceIds = Array.from(document.querySelectorAll('.invite-ws:checked')).map(function(el){return el.value;});
